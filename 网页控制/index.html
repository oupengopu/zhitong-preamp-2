<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=../www/index.html">
  <title>智能前级控制台跳转</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #121624;
      color: #e8eaed;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    a { color: #00e676; }
  </style>
</head>
<body>
  <main>
    正在打开新版控制台...
    <a id="fallback-link" href="../www/index.html">手动打开</a>
  </main>
  <script>
    const target = '../www/index.html' + window.location.search + window.location.hash;
    document.getElementById('fallback-link').href = target;
    window.location.replace(target);
  </script>
</body>
</html>
