            text_font: font_cn
            text_align: CENTER
            text_color: 0xF97316
            hidden: true
    # ── 全屏频谱页 (30秒无操作后自动切换, 立体声14条) ──
    - id: spectrum_page
      bg_color: 0x111827
      widgets:
        # ── 左上角输入源图标 + 名称 ──
        - label:
            id: lbl_spec_input_icon
            x: 4
            y: 3
            width: 28
            height: 24
            text: !lambda |-
              const char* icons[] = {"\U000F0960", "\U000F061A", "\U000F0322", "\U000F186C"};
              return icons[id(current_input)];
            text_font: mdi_icons_22
            text_color: !lambda |-
              return get_theme_accent(id(theme));
            text_align: LEFT
        - label:
            id: lbl_spec_input
            x: 34
            y: 3
            width: 90
            height: 24
            text: !lambda |-
              const char* names[] = {"CD", "DAC", "PC", "AUX"};
              return names[id(current_input)];
            text_font: montserrat_21
            text_color: 0x6A9FB8
            text_align: LEFT
        # ── 右上角温度 ──
        - label:
            id: lbl_spec_temp
            x: 308
            y: 3
            width: 120
            height: 24
            text: !lambda |-
              static char buf[20];
              if (id(ntc_temp)->has_state())
                snprintf(buf, sizeof(buf), "%.1f°C", id(ntc_temp)->state);
              else
                snprintf(buf, sizeof(buf), "--.-°C");
              return buf;
            text_font: montserrat_16
            text_color: 0x5A7090
            text_align: RIGHT

