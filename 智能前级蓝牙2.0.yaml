script:
  - id: register_learned_remote_keys
    mode: restart
    then:
      - lambda: |-
          auto reg = [](int action, int handle, int len, int kind, int value, int aux, uint32_t hash) {
            if (handle > 0 && len > 0 && kind > 0 && value > 0) {
              ble_hid_host::set_learned_key((ble_hid_host::HidEventType)action, handle, len, kind, value, aux, hash);
            }
          };
          reg(1, id(learned_key_1_handle), id(learned_key_1_len), id(learned_key_1_kind), id(learned_key_1_value), id(learned_key_1_aux), id(learned_key_1_hash));
          reg(2, id(learned_key_2_handle), id(learned_key_2_len), id(learned_key_2_kind), id(learned_key_2_value), id(learned_key_2_aux), id(learned_key_2_hash));
          reg(3, id(learned_key_3_handle), id(learned_key_3_len), id(learned_key_3_kind), id(learned_key_3_value), id(learned_key_3_aux), id(learned_key_3_hash));
          reg(4, id(learned_key_4_handle), id(learned_key_4_len), id(learned_key_4_kind), id(learned_key_4_value), id(learned_key_4_aux), id(learned_key_4_hash));
          reg(5, id(learned_key_5_handle), id(learned_key_5_len), id(learned_key_5_kind), id(learned_key_5_value), id(learned_key_5_aux), id(learned_key_5_hash));
          reg(6, id(learned_key_6_handle), id(learned_key_6_len), id(learned_key_6_kind), id(learned_key_6_value), id(learned_key_6_aux), id(learned_key_6_hash));
          reg(7, id(learned_key_7_handle), id(learned_key_7_len), id(learned_key_7_kind), id(learned_key_7_value), id(learned_key_7_aux), id(learned_key_7_hash));
          reg(8, id(learned_key_8_handle), id(learned_key_8_len), id(learned_key_8_kind), id(learned_key_8_value), id(learned_key_8_aux), id(learned_key_8_hash));
          reg(9, id(learned_key_9_handle), id(learned_key_9_len), id(learned_key_9_kind), id(learned_key_9_value), id(learned_key_9_aux), id(learned_key_9_hash));

  - id: save_learned_remote_key
    mode: restart
    parameters:
      action: int
      handle: int
      len: int
      kind: int
      value: int
      aux: int
      hash: uint32_t
    then:
      - lambda: |-
          switch (action) {
            case 1: id(learned_key_1_handle) = handle; id(learned_key_1_len) = len; id(learned_key_1_kind) = kind; id(learned_key_1_value) = value; id(learned_key_1_aux) = aux; id(learned_key_1_hash) = hash; break;
            case 2: id(learned_key_2_handle) = handle; id(learned_key_2_len) = len; id(learned_key_2_kind) = kind; id(learned_key_2_value) = value; id(learned_key_2_aux) = aux; id(learned_key_2_hash) = hash; break;
            case 3: id(learned_key_3_handle) = handle; id(learned_key_3_len) = len; id(learned_key_3_kind) = kind; id(learned_key_3_value) = value; id(learned_key_3_aux) = aux; id(learned_key_3_hash) = hash; break;
            case 4: id(learned_key_4_handle) = handle; id(learned_key_4_len) = len; id(learned_key_4_kind) = kind; id(learned_key_4_value) = value; id(learned_key_4_aux) = aux; id(learned_key_4_hash) = hash; break;
            case 5: id(learned_key_5_handle) = handle; id(learned_key_5_len) = len; id(learned_key_5_kind) = kind; id(learned_key_5_value) = value; id(learned_key_5_aux) = aux; id(learned_key_5_hash) = hash; break;
            case 6: id(learned_key_6_handle) = handle; id(learned_key_6_len) = len; id(learned_key_6_kind) = kind; id(learned_key_6_value) = value; id(learned_key_6_aux) = aux; id(learned_key_6_hash) = hash; break;
            case 7: id(learned_key_7_handle) = handle; id(learned_key_7_len) = len; id(learned_key_7_kind) = kind; id(learned_key_7_value) = value; id(learned_key_7_aux) = aux; id(learned_key_7_hash) = hash; break;
            case 8: id(learned_key_8_handle) = handle; id(learned_key_8_len) = len; id(learned_key_8_kind) = kind; id(learned_key_8_value) = value; id(learned_key_8_aux) = aux; id(learned_key_8_hash) = hash; break;
            case 9: id(learned_key_9_handle) = handle; id(learned_key_9_len) = len; id(learned_key_9_kind) = kind; id(learned_key_9_value) = value; id(learned_key_9_aux) = aux; id(learned_key_9_hash) = hash; break;
            default: return;
          }
          ble_hid_host::set_learned_key((ble_hid_host::HidEventType)action, handle, len, kind, value, aux, hash);
          // ??????????? key_map ???????????????A?B
          switch (action) {
            case 1: id(key_map_1) = 1; break;
            case 2: id(key_map_2) = 2; break;
            case 3: id(key_map_3) = 3; break;
            case 4: id(key_map_4) = 4; break;
            case 5: id(key_map_5) = 5; break;
            case 6: id(key_map_6) = 6; break;
            case 7: id(key_map_7) = 7; break;
            case 8: id(key_map_8) = 8; break;
            case 9: id(key_map_9) = 9; break;
          }
          ESP_LOGI("ble_hid", "learned remote key action=%d handle=0x%04x len=%d kind=%d value=%d aux=%d hash=0x%08x",
                   action, handle, len, kind, value, aux, (unsigned)hash);

  - id: clear_learned_remote_keys
    mode: restart
    then:
      - lambda: |-
          id(key_learn_waiting) = false;
          id(key_learn_target) = 0;
          id(key_learn_started_ms) = 0;
          id(key_learn_feedback_idx) = -1;
          id(key_learn_feedback_until_ms) = 0;
          id(key_learn_select_idx) = 1;
          id(key_learn_pick_mode) = false;
          ble_hid_host::clear_raw_event();
          id(learned_key_1_handle) = 0; id(learned_key_1_len) = 0; id(learned_key_1_kind) = 0; id(learned_key_1_value) = 0; id(learned_key_1_aux) = 0; id(learned_key_1_hash) = 0;
          id(learned_key_2_handle) = 0; id(learned_key_2_len) = 0; id(learned_key_2_kind) = 0; id(learned_key_2_value) = 0; id(learned_key_2_aux) = 0; id(learned_key_2_hash) = 0;
          id(learned_key_3_handle) = 0; id(learned_key_3_len) = 0; id(learned_key_3_kind) = 0; id(learned_key_3_value) = 0; id(learned_key_3_aux) = 0; id(learned_key_3_hash) = 0;
          id(learned_key_4_handle) = 0; id(learned_key_4_len) = 0; id(learned_key_4_kind) = 0; id(learned_key_4_value) = 0; id(learned_key_4_aux) = 0; id(learned_key_4_hash) = 0;
          id(learned_key_5_handle) = 0; id(learned_key_5_len) = 0; id(learned_key_5_kind) = 0; id(learned_key_5_value) = 0; id(learned_key_5_aux) = 0; id(learned_key_5_hash) = 0;
          id(learned_key_6_handle) = 0; id(learned_key_6_len) = 0; id(learned_key_6_kind) = 0; id(learned_key_6_value) = 0; id(learned_key_6_aux) = 0; id(learned_key_6_hash) = 0;
          id(learned_key_7_handle) = 0; id(learned_key_7_len) = 0; id(learned_key_7_kind) = 0; id(learned_key_7_value) = 0; id(learned_key_7_aux) = 0; id(learned_key_7_hash) = 0;
          id(learned_key_8_handle) = 0; id(learned_key_8_len) = 0; id(learned_key_8_kind) = 0; id(learned_key_8_value) = 0; id(learned_key_8_aux) = 0; id(learned_key_8_hash) = 0;
          id(learned_key_9_handle) = 0; id(learned_key_9_len) = 0; id(learned_key_9_kind) = 0; id(learned_key_9_value) = 0; id(learned_key_9_aux) = 0; id(learned_key_9_hash) = 0;
          ble_hid_host::clear_all_learned_keys();
          lv_label_set_text(id(val_keymap_learn), remote_keys::get_action_name(id(key_learn_select_idx)).c_str());

  - id: refresh_keymap_values
    mode: restart
    then:
      - lambda: |-
          lv_label_set_text(id(val_keymap_0), remote_keys::get_action_name(id(key_map_1)).c_str());
          lv_label_set_text(id(val_keymap_1), remote_keys::get_action_name(id(key_map_2)).c_str());
          lv_label_set_text(id(val_keymap_2), remote_keys::get_action_name(id(key_map_3)).c_str());
          lv_label_set_text(id(val_keymap_3), remote_keys::get_action_name(id(key_map_4)).c_str());
          lv_label_set_text(id(val_keymap_4), remote_keys::get_action_name(id(key_map_5)).c_str());
          lv_label_set_text(id(val_keymap_5), remote_keys::get_action_name(id(key_map_6)).c_str());
          lv_label_set_text(id(val_keymap_6), remote_keys::get_action_name(id(key_map_7)).c_str());
          lv_label_set_text(id(val_keymap_7), remote_keys::get_action_name(id(key_map_8)).c_str());
          lv_label_set_text(id(val_keymap_8), remote_keys::get_action_name(id(key_map_9)).c_str());
          lv_label_set_text(id(val_keymap_reset), "清空");

  - id: refresh_keymap_learn_row
    mode: restart
    then:
      - lambda: |-
          int action = id(key_learn_select_idx);
          if (action < 1 || action > 9) action = 1;
          std::string label = remote_keys::get_action_name(action);
          if (id(key_learn_waiting)) {
            label = "学习中: " + label;
          } else if (id(key_learn_feedback_idx) == action - 1 &&
                     (int32_t)(millis() - id(key_learn_feedback_until_ms)) < 0) {
            label = "已学习: " + label;
          } else if (id(key_learn_pick_mode)) {
            label = "选择: " + label;
          }
          lv_label_set_text(id(val_keymap_learn), label.c_str());

  - id: start_remote_key_learning
    mode: restart
    parameters:
      action: int
    then:
      - lambda: |-
          if (action < 1 || action > 9) return;
          id(key_learn_waiting) = true;
          id(key_learn_target) = action;
          id(key_learn_started_ms) = millis();
          id(key_learn_feedback_idx) = -1;
          id(key_learn_feedback_until_ms) = 0;
          id(key_learn_select_idx) = action;
          id(key_learn_pick_mode) = false;
          ble_hid_host::begin_learning_capture();
          id(refresh_keymap_values)->execute();
          id(refresh_keymap_learn_row)->execute();
          ESP_LOGI("ble_hid", "remote key learn start action=%d", action);

  - id: poll_remote_key_learning
    mode: restart
    then:
      - lambda: |-
          uint32_t now = millis();
          if (!id(key_learn_waiting)) {
            if (id(key_learn_feedback_idx) >= 0 &&
                (int32_t)(now - id(key_learn_feedback_until_ms)) >= 0) {
              id(key_learn_feedback_idx) = -1;
              id(key_learn_feedback_until_ms) = 0;
              id(refresh_keymap_values)->execute();
              id(refresh_keymap_learn_row)->execute();
            }
            return;
          }
          if (now - id(key_learn_started_ms) > 10000) {
            id(key_learn_waiting) = false;
            id(key_learn_target) = 0;
            id(key_learn_started_ms) = 0;
            id(key_learn_pick_mode) = false;
            ble_hid_host::clear_raw_event();
            id(refresh_keymap_values)->execute();
            std::string text = "超时: " + remote_keys::get_action_name(id(key_learn_select_idx));
            lv_label_set_text(id(val_keymap_learn), text.c_str());
            ESP_LOGI("ble_hid", "remote key learn timeout");
            return;
          }

          uint16_t handle = 0;
          uint16_t len = 0;
          uint8_t kind = 0;
          uint8_t value = 0;
          uint16_t aux = 0;
          uint32_t hash = 0;
          if (!ble_hid_host::get_last_normalized_fingerprint(&handle, &len, &kind, &value, &aux, &hash)) return;

          int action = id(key_learn_target);
          if (action < 1 || action > 9) return;
          id(save_learned_remote_key)->execute(action, (int)handle, (int)len, (int)kind, (int)value, (int)aux, hash);
          while (ble_hid_host::has_event()) {
            ble_hid_host::pop_event();
          }
          id(key_learn_waiting) = false;
          id(key_learn_target) = 0;
          id(key_learn_started_ms) = 0;
          id(key_learn_select_idx) = action;
          id(key_learn_pick_mode) = false;
          id(key_learn_feedback_idx) = action - 1;
          id(key_learn_feedback_until_ms) = now + 1500;
          id(refresh_keymap_learn_row)->execute();

  - id: style_secondary_pages
    mode: restart
    then:
      - lambda: |-
          lv_color_t accent = get_theme_accent(id(theme));
          lv_obj_t* active_page = lv_scr_act();
          bool style_all =
            active_page != id(settings_page)->obj &&
            active_page != id(ble_remote_page)->obj &&
            active_page != id(remote_keys_page)->obj &&
            active_page != id(debug_page)->obj;
          bool style_settings = style_all || active_page == id(settings_page)->obj;
          bool style_ble = style_all || active_page == id(ble_remote_page)->obj ||
            (active_page == id(settings_page)->obj && id(settings_focus_idx) == 8);
          bool style_keymap = style_all || active_page == id(remote_keys_page)->obj ||
            (active_page == id(settings_page)->obj && id(settings_focus_idx) == 9);
          bool style_debug = style_all || active_page == id(debug_page)->obj ||
            (active_page == id(settings_page)->obj && id(settings_focus_idx) == 13);

          if (style_settings) {
            secondary_ui::page(id(settings_page)->obj);
            settings_ui::init(
              (lv_obj_t*)id(row_max_vol), (lv_obj_t*)id(row_power_on),
              (lv_obj_t*)id(row_balance), (lv_obj_t*)id(row_input),
              (lv_obj_t*)id(row_auto_switch), (lv_obj_t*)id(row_brightness),
              (lv_obj_t*)id(row_timeout), (lv_obj_t*)id(row_theme),
              (lv_obj_t*)id(row_ble_remote), (lv_obj_t*)id(row_keymap),
              (lv_obj_t*)id(row_output_mode),
              (lv_obj_t*)id(row_spectrum_auto), (lv_obj_t*)id(row_spectrum_theme),
              (lv_obj_t*)id(row_firmware), (lv_obj_t*)id(row_ip),
              (lv_obj_t*)id(bar_max_vol), (lv_obj_t*)id(bar_power_on_limit),
              (lv_obj_t*)id(bar_balance),
              (lv_obj_t*)id(bar_brightness), (lv_obj_t*)id(bar_display_timeout)
            );

            lv_obj_t** setting_rows = settings_ui::rows();
            lv_obj_t** setting_bars = settings_ui::bars();
            int setting_focus = id(settings_focus_idx);
            int setting_active = id(settings_active_idx);
            for (int i = 0; i < settings_ui::N; i++) {
              bool focused = (setting_active < 0 && i == setting_focus);
              bool active = (setting_active == i);
              bool dim = (i == 8 || i == 9 || i == 13 || i == 14);
              secondary_ui::row(setting_rows[i], accent, focused, dim, active);
              lv_obj_t* c0 = lv_obj_get_child(setting_rows[i], 0);
              lv_obj_t* c1 = lv_obj_get_child(setting_rows[i], 1);
              lv_obj_t* c2 = lv_obj_get_child(setting_rows[i], 2);
              lv_obj_t* c3 = lv_obj_get_child(setting_rows[i], 3);
              if (c0) lv_obj_set_width(c0, 22);
              if (c1) lv_obj_set_width(c1, (i == 9) ? 94 : 76);
              if (setting_bars[i]) {
                lv_obj_set_width(setting_bars[i], 176);
                lv_obj_set_height(setting_bars[i], active ? settings_ui::BAR_ACTIVE_H : settings_ui::bar_base_heights[i]);
                if (c3) lv_obj_set_width(c3, 48);
              } else if (i == 7) {
                if (c2) lv_obj_set_width(c2, 12);
                if (c3) lv_obj_set_width(c3, 230);
              } else {
                if (c2) lv_obj_set_width(c2, (i == 9) ? 230 : 250);
              }
            }
          }

          if (style_ble) {
            secondary_ui::page(id(ble_remote_page)->obj);
            secondary_ui::title(id(ble_row_title), accent);
            {
              lv_obj_t* icon = lv_obj_get_child(id(ble_row_title), 0);
              lv_obj_t* name = lv_obj_get_child(id(ble_row_title), 1);
              if (icon) lv_obj_set_width(icon, 22);
              if (name) lv_obj_set_width(name, 150);
            }
            secondary_ui::row(id(ble_row_status), accent, false, true, false, secondary_ui::DEBUG_H);
            secondary_ui::row(id(ble_row_scan), accent, id(ble_remote_focus_idx) == 0);
            secondary_ui::row(id(ble_row_dev0), accent, id(ble_remote_focus_idx) == 1);
            secondary_ui::row(id(ble_row_dev1), accent, id(ble_remote_focus_idx) == 2);
            secondary_ui::row(id(ble_row_dev2), accent, id(ble_remote_focus_idx) == 3);
            secondary_ui::row(id(ble_row_back), accent, id(ble_remote_focus_idx) == 4, true);
            {
              lv_obj_t* status = lv_obj_get_child(id(ble_row_status), 0);
              if (status) lv_obj_set_width(status, 360);
              lv_obj_t* scan_icon = lv_obj_get_child(id(ble_row_scan), 0);
              lv_obj_t* scan_text = lv_obj_get_child(id(ble_row_scan), 1);
              if (scan_icon) lv_obj_set_width(scan_icon, 22);
              if (scan_text) lv_obj_set_width(scan_text, 260);
            }
          }

          if (style_keymap) {
            secondary_ui::page(id(remote_keys_page)->obj);
            secondary_ui::title(id(keymap_row_title), accent);
            {
              lv_obj_t* title_icon = lv_obj_get_child(id(keymap_row_title), 0);
              if (title_icon) lv_obj_set_style_text_color(title_icon, accent, LV_PART_MAIN);
              if (title_icon) lv_obj_set_width(title_icon, 22);
              lv_obj_t* title_text = lv_obj_get_child(id(keymap_row_title), 1);
              if (title_text) lv_obj_set_width(title_text, 150);
              lv_obj_t* title_status = lv_obj_get_child(id(keymap_row_title), 2);
              if (title_status) lv_obj_set_width(title_status, 210);
              if (title_status) lv_obj_set_style_text_color(title_status, accent, LV_PART_MAIN);
            }
            lv_obj_t* key_rows[] = {
              id(keymap_row_0), id(keymap_row_1), id(keymap_row_2), id(keymap_row_3),
              id(keymap_row_4), id(keymap_row_5), id(keymap_row_6), id(keymap_row_7),
              id(keymap_row_8), id(keymap_row_learn), id(keymap_row_reset), id(keymap_row_back)
            };
            for (int i = 0; i <= 11; i++) {
              bool focused = (id(keymap_active_idx) < 0 && id(keymap_focus_idx) == i);
              bool active = (id(keymap_active_idx) == i);
              bool dim = (i == 11);
              secondary_ui::row(key_rows[i], accent, focused, dim, active);
              lv_color_t row_accent = (focused || active) ? accent : lv_color_hex(dim ? 0x6B7280 : 0x8E9FB8);
              lv_obj_t* icon = lv_obj_get_child(key_rows[i], 0);
              lv_obj_t* name = lv_obj_get_child(key_rows[i], 1);
              lv_obj_t* value = lv_obj_get_child(key_rows[i], 2);
              if (icon) lv_obj_set_width(icon, 22);
              if (name) lv_obj_set_width(name, 94);
              if (value) lv_obj_set_width(value, 250);
              if (icon) lv_obj_set_style_text_color(icon, row_accent, LV_PART_MAIN);
              if (name) lv_obj_set_style_text_color(name, dim ? lv_color_hex(0x8E9FB8) : lv_color_hex(0xE5E7EB), LV_PART_MAIN);
              if (value) lv_obj_set_style_text_color(value, row_accent, LV_PART_MAIN);
            }
          }

          if (style_debug) {
            lv_obj_set_style_bg_color(id(debug_page)->obj, lv_color_hex(0x0A1220), LV_PART_MAIN);
            lv_obj_set_style_pad_all(id(debug_page)->obj, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_row(id(debug_page)->obj, 0, LV_PART_MAIN);
            lv_obj_set_style_pad_column(id(debug_page)->obj, 0, LV_PART_MAIN);

            auto style_debug_cell = [&](lv_obj_t* row, int x, int y, int w, int h, bool focused, bool dim) {
              lv_obj_set_x(row, x);
              lv_obj_set_y(row, y);
              lv_obj_set_width(row, w);
              lv_obj_set_height(row, h);
              lv_obj_set_style_pad_all(row, 2, LV_PART_MAIN);
              lv_obj_set_style_bg_color(row, lv_color_hex(focused ? 0x142033 : (dim ? 0x080D16 : 0x101827)), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(row, focused ? LV_OPA_70 : LV_OPA_30, LV_PART_MAIN);
              lv_obj_set_style_border_width(row, focused ? 2 : 1, LV_PART_MAIN);
              lv_obj_set_style_border_color(row, focused ? accent : lv_color_hex(0x172235), LV_PART_MAIN);
              lv_obj_set_style_border_side(row, LV_BORDER_SIDE_FULL, LV_PART_MAIN);
            };

            style_debug_cell(id(dbg_row_title), 6, 4, 416, 24, false, false);
            {
              lv_obj_t* icon = lv_obj_get_child(id(dbg_row_title), 0);
              lv_obj_t* title = lv_obj_get_child(id(dbg_row_title), 1);
              if (icon) lv_obj_set_width(icon, 22);
              if (title) lv_obj_set_width(title, 180);
              if (icon) lv_obj_set_style_text_color(icon, accent, LV_PART_MAIN);
            }

            struct DebugCellSpec { lv_obj_t* row; int x; int y; int w; };
            DebugCellSpec cells[] = {
              {id(dbg_row_cpu),      6,   32, 204},
              {id(dbg_row_heap),     214, 32, 208},
              {id(dbg_row_minheap),  6,   56, 204},
              {id(dbg_row_psram),    214, 56, 208},
              {id(dbg_row_minpsram), 6,   80, 204},
              {id(dbg_row_uptime),   214, 80, 208},
            };
            for (auto& cell : cells) {
              style_debug_cell(cell.row, cell.x, cell.y, cell.w, 22, false, false);
              lv_obj_t* label = lv_obj_get_child(cell.row, 0);
              if (label) lv_obj_set_width(label, cell.w - 8);
            }

            style_debug_cell(id(dbg_row_recal), 6, 106, 204, 30, id(debug_focus_idx) == 0, false);
            style_debug_cell(id(dbg_row_back), 214, 106, 208, 30, id(debug_focus_idx) == 1, true);
            lv_obj_t* action_rows[] = { id(dbg_row_recal), id(dbg_row_back) };
            for (auto* row : action_rows) {
              lv_obj_t* icon = lv_obj_get_child(row, 0);
              lv_obj_t* text = lv_obj_get_child(row, 1);
              if (icon) lv_obj_set_width(icon, 22);
              if (text) lv_obj_set_width(text, 170);
              if (icon) lv_obj_set_style_text_color(icon, accent, LV_PART_MAIN);
            }
          }

  - id: show_debug_page
    mode: restart
    then:
      - lambda: |-
          id(debug_focus_idx) = 0;
          id(style_secondary_pages)->execute();
          id(last_display_interaction) = millis();
          lv_scr_load_anim(id(debug_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);

  - id: encoder_click_action
    mode: restart
    then:
      - lambda: |-
          if (id(display_is_off)) {
            id(reset_idle_timer)->execute();
          }

          lv_obj_t* active_page = lv_scr_act();
          if (active_page == id(settings_page)->obj) {
            lv_obj_t** rows = settings_ui::rows();
            lv_obj_t** bars = settings_ui::bars();
            int idx = id(settings_focus_idx);
            if (id(settings_active_idx) < 0) {
              if (idx == 8) {
                id(ble_remote_focus_idx) = 0;
                id(ble_remote_device_count) = 0;
                id(ble_remote_scan_status) = ble_hid_host::is_connected() ? "已连接: " + ble_hid_host::get_connected_name() : "未连接";
                id(ble_remote_connected) = ble_hid_host::is_connected();
                id(style_secondary_pages)->execute();
                id(last_display_interaction) = millis();
                lv_scr_load_anim(id(ble_remote_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
                id(reset_idle_timer)->execute();
                return;
              }
              if (idx == 9) {
                id(keymap_focus_idx) = 0;
                id(keymap_active_idx) = -1;
                id(key_learn_waiting) = false;
                id(key_learn_target) = 0;
                id(key_learn_started_ms) = 0;
                id(key_learn_pick_mode) = false;
                ble_hid_host::clear_raw_event();
                id(refresh_keymap_values)->execute();
                id(refresh_keymap_learn_row)->execute();
                id(style_secondary_pages)->execute();
                id(last_display_interaction) = millis();
                lv_scr_load_anim(id(remote_keys_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
                id(reset_idle_timer)->execute();
                return;
              }
              if (idx == 13) {
                uint32_t now = millis();
                if (now - id(firmware_hidden_click_started_ms) > 1200) {
                  id(firmware_hidden_click_started_ms) = now;
                  id(firmware_hidden_click_count) = 0;
                }
                id(firmware_hidden_click_count)++;
                if (id(firmware_hidden_click_count) >= 3) {
                  id(firmware_hidden_click_count) = 0;
                  id(firmware_hidden_click_started_ms) = 0;
                  id(show_debug_page)->execute();
                }
                id(reset_idle_timer)->execute();
                return;
              }
              if (idx == 14) return;
              id(settings_active_idx) = idx;
              if (bars[idx]) lv_obj_set_height(bars[idx], settings_ui::BAR_ACTIVE_H);
            } else {
              int active = id(settings_active_idx);
              id(settings_active_idx) = -1;
              if (bars[active]) lv_obj_set_height(bars[active], settings_ui::bar_base_heights[active]);
              if (active == 7) id(apply_theme)->execute();
            }
            id(style_secondary_pages)->execute();
            id(reset_idle_timer)->execute();
            return;
          }

          if (active_page == id(ble_remote_page)->obj) {
            int f = id(ble_remote_focus_idx);
            if (f == 0) {
              if (id(ble_remote_scanning)) {
                ble_hid_host::stop_scan();
                id(ble_remote_scanning) = false;
                id(ble_remote_scan_status) = ble_hid_host::is_connected() ? "已连接: " + ble_hid_host::get_connected_name() : "未连接";
              } else {
                ble_hid_host::start_scan();
                id(ble_remote_scanning) = true;
                id(ble_remote_device_count) = 0;
                id(ble_remote_scan_status) = "扫描中...";
              }
            } else if (f >= 1 && f <= 3) {
              int dev_idx = f - 1;
              int count = id(ble_remote_device_count);
              if (dev_idx < count) {
                id(ble_remote_scan_status) = "正在连接...";
                ble_hid_host::connect(dev_idx);
              }
            } else if (f == 4) {
              if (ble_hid_host::is_connected()) {
                ble_hid_host::disconnect();
                id(ble_remote_peer_bda) = "\"\"";
                id(ble_remote_battery) = -1;
                id(ble_remote_connected) = false;
                id(ble_remote_scan_status) = "未连接";
              } else {
                lv_scr_load_anim(id(settings_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
              }
            }
            id(reset_idle_timer)->execute();
            return;
          }

          if (active_page == id(remote_keys_page)->obj) {
            int f = id(keymap_focus_idx);
            int act = id(keymap_active_idx);
            if (f >= 0 && f <= 8) {
              id(keymap_active_idx) = (act < 0) ? f : -1;
              id(style_secondary_pages)->execute();
            } else if (f == 9) {
              if (id(key_learn_waiting)) {
                id(key_learn_waiting) = false;
                id(key_learn_target) = 0;
                id(key_learn_started_ms) = 0;
                id(key_learn_pick_mode) = false;
                ble_hid_host::clear_raw_event();
                id(refresh_keymap_learn_row)->execute();
              } else if (id(key_learn_pick_mode)) {
                int action = id(key_learn_select_idx);
                if (action < 1 || action > 9) action = 1;
                id(keymap_active_idx) = -1;
                id(start_remote_key_learning)->execute(action);
              } else {
                id(key_learn_pick_mode) = true;
                id(keymap_active_idx) = 9;
                id(refresh_keymap_learn_row)->execute();
                id(style_secondary_pages)->execute();
              }
            } else if (f == 10) {
              id(keymap_active_idx) = -1;
              id(clear_learned_remote_keys)->execute();
              lv_label_set_text(id(val_keymap_reset), "已清空");
              id(style_secondary_pages)->execute();
            } else if (f == 11) {
              id(keymap_active_idx) = -1;
              id(key_learn_waiting) = false;
              id(key_learn_target) = 0;
              id(key_learn_started_ms) = 0;
              id(key_learn_pick_mode) = false;
              ble_hid_host::clear_raw_event();
              id(refresh_keymap_values)->execute();
              id(refresh_keymap_learn_row)->execute();
              lv_scr_load_anim(id(settings_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
            }
            id(reset_idle_timer)->execute();
            return;
          }

          if (active_page == id(debug_page)->obj) {
            ESP_LOGI("ENC_BTN", "debug click focus=%d", id(debug_focus_idx));
            if (id(debug_focus_idx) == 0) {
              bool ok = msgeq7::recalibrate();
              lv_label_set_text(id(lbl_dbg_recal), ok ? "校准完成" : "校准失败");
              id(style_secondary_pages)->execute();
            } else {
              lv_scr_load_anim(id(settings_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
            }
            id(reset_idle_timer)->execute();
            return;
          }

          if (active_page == id(spectrum_page)->obj) {
            id(spectrum_auto_suppress_until_ms) = millis() + 1000;
            lv_scr_load_anim(id(main_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
            id(reset_idle_timer)->execute();
            return;
          }

          if (active_page == id(main_page)->obj) {
            id(settings_focus_idx) = 0;
            id(settings_active_idx) = -1;
            settings_ui::init(
              (lv_obj_t*)id(row_max_vol), (lv_obj_t*)id(row_power_on),
              (lv_obj_t*)id(row_balance), (lv_obj_t*)id(row_input),
              (lv_obj_t*)id(row_auto_switch), (lv_obj_t*)id(row_brightness),
              (lv_obj_t*)id(row_timeout), (lv_obj_t*)id(row_theme),
              (lv_obj_t*)id(row_ble_remote), (lv_obj_t*)id(row_keymap),
              (lv_obj_t*)id(row_output_mode),
              (lv_obj_t*)id(row_spectrum_auto), (lv_obj_t*)id(row_spectrum_theme),
              (lv_obj_t*)id(row_firmware), (lv_obj_t*)id(row_ip),
              (lv_obj_t*)id(bar_max_vol), (lv_obj_t*)id(bar_power_on_limit),
              (lv_obj_t*)id(bar_balance),
              (lv_obj_t*)id(bar_brightness), (lv_obj_t*)id(bar_display_timeout)
            );
            id(style_secondary_pages)->execute();
            lv_obj_scroll_to_view(settings_ui::rows()[0], LV_ANIM_OFF);
            lv_scr_load_anim(id(settings_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
          }
          id(reset_idle_timer)->execute();

  - id: encoder_double_action
    mode: restart
    then:
      - lambda: |-
          lv_obj_t* active_page = lv_scr_act();
          if (active_page == id(main_page)->obj || active_page == id(spectrum_page)->obj) {
            if (id(soft_mute)) id(soft_mute_switch)->turn_off();
            else id(soft_mute_switch)->turn_on();
            id(reset_idle_timer)->execute();
            return;
          }

  - id: encoder_long_action
    mode: restart
    then:
      - lambda: |-
          lv_obj_t* active_page = lv_scr_act();
          bool secondary = active_page == id(settings_page)->obj ||
                           active_page == id(ble_remote_page)->obj ||
                           active_page == id(debug_page)->obj ||
                           active_page == id(remote_keys_page)->obj;
          if (secondary) {
            if (active_page == id(settings_page)->obj) {
              int active = id(settings_active_idx);
              if (active >= 0) {
                lv_obj_t** bars = settings_ui::bars();
                if (bars[active]) lv_obj_set_height(bars[active], settings_ui::bar_base_heights[active]);
              }
              id(settings_active_idx) = -1;
            }
            if (active_page == id(remote_keys_page)->obj) {
              id(keymap_active_idx) = -1;
              id(key_learn_waiting) = false;
              id(key_learn_target) = 0;
              id(key_learn_started_ms) = 0;
              id(key_learn_pick_mode) = false;
              ble_hid_host::clear_raw_event();
              id(refresh_keymap_values)->execute();
              id(refresh_keymap_learn_row)->execute();
            }
            id(style_secondary_pages)->execute();
            lv_scr_load_anim(id(main_page)->obj, LV_SCR_LOAD_ANIM_FADE_IN, 200, 0, false);
            id(reset_idle_timer)->execute();
            return;
          }

          if (id(standby)) {
            if (!id(temp_protect)) id(exit_standby)->execute();
          } else if (id(system_ready)) {
            id(enter_standby)->execute();
          } else {
            id(start_wifi_ap)->execute();
          }

  - id: show_splash_boot
    mode: restart
    then:
      - lvgl.resume:
      - lvgl.page.show:
          id: splash_page
          animation: LV_SCREEN_LOAD_ANIM_NONE
          time: 50ms
      - lambda: |-
          lv_obj_set_style_opa(id(lbl_splash_title), (lv_opa_t)15, LV_PART_MAIN);
          lv_obj_set_style_opa(id(lbl_splash_sub), (lv_opa_t)15, LV_PART_MAIN);
          lv_obj_set_style_opa(id(lbl_splash_ver), (lv_opa_t)180, LV_PART_MAIN);
          lv_obj_invalidate(lv_scr_act());
          lv_refr_now(NULL);
          auto call = id(display_backlight)->turn_on();
          call.set_brightness(id(display_brightness) / 100.0f);
          call.perform();
          ESP_LOGI("BOOT_DIAG", "show_splash_boot action: heap=%u", (unsigned)esp_get_free_heap_size());

  - id: show_main_boot
    mode: restart
    then:
      - lvgl.resume:
      - lvgl.page.show:
          id: main_page
          animation: LV_SCREEN_LOAD_ANIM_NONE
          time: 50ms
      - lambda: |-
          lv_obj_invalidate(lv_scr_act());
          lv_refr_now(NULL);
          auto call = id(display_backlight)->turn_on();
          call.set_brightness(id(display_brightness) / 100.0f);
          call.perform();
          if (!id(system_ready)) {
            id(system_ready) = true;
            ESP_LOGW("BOOT_DIAG", "system_ready recovered by show_main_boot: heap=%u", (unsigned)esp_get_free_heap_size());
          }
          if (id(power_transitioning)) {
            ESP_LOGI("BOOT_DIAG", "power transition released by show_main_boot");
          }
          id(power_transitioning) = false;
          if (id(switching_input) && millis() > 8000) {
            id(switching_input) = false;
            id(active_input) = id(current_input);
            ESP_LOGW("BOOT_DIAG", "stale boot input switch cleared by show_main_boot");
          }
          if (!id(standby)) {
            id(display_idle_timer)->execute();
            id(apply_theme)->execute();
            if (!id(soft_mute) && !id(temp_protect) && !id(ota_active)) id(mute_switch)->turn_off();
            id(send_volume_to_pga)->execute();
          }
          ESP_LOGI("BOOT_DIAG", "show_main_boot action: heap=%u", (unsigned)esp_get_free_heap_size());

  - id: media_reset
    mode: restart
    then:
      - delay: 300ms
      - lambda: |-
          id(media_select)->publish_state("空闲");

  - id: start_wifi_ap
    mode: restart
    then:
      - lambda: 'wifi::global_wifi_component->save_wifi_sta("", "");'
      - delay: 2s
      - lambda: 'App.safe_reboot();'

  # ── 恢复出厂设置: 重置所有存储值 + 清除 WiFi + 重启 ──
  # 触发方式: 待机或工作状态下长按编码器按键 10 秒
  # 流程: 重置变量 → 屏幕显示提示 → 清除 WiFi → 重启进入 AP 配网模式
  - id: factory_reset
    mode: restart
    then:
      - lambda: |-
          // 重置所有 restore_value 全局变量到安全默认值
          id(volume_val)          = 160;
          id(v210_migrated)       = true;  // 重置后标记已迁移, 不再二次缩放
          id(v211_balance_migrated) = true;  // 重置后标记已迁移, 不再复制旧平衡
          id(current_input)       = 0;
          id(balance)             = 0;
          id(max_volume)          = 255;
          id(power_on_limit)      = 192;
          id(display_timeout_min) = 5;
          id(display_brightness)  = 80;
          id(auto_input)          = true;
          id(output_mode)         = false;
          id(spectrum_auto_seconds) = 15;
          id(spectrum_theme)      = 2;
          id(temp_protect_forced_standby) = false;
          id(auto_switch_pending) = false;
          id(theme)               = 0;
          id(input_vol_0)         = 160;
          id(input_vol_1)         = 160;
          id(input_vol_2)         = 160;
          id(input_vol_3)         = 160;
          id(input_bal_0)         = 0;
          id(input_bal_1)         = 0;
          id(input_bal_2)         = 0;
          id(input_bal_3)         = 0;
          id(soft_mute)           = false;
          id(relay_out)->turn_off();
          // 重置按键映射为恒等映射
          id(key_map_1) = 1; id(key_map_2) = 2; id(key_map_3) = 3;
          id(key_map_4) = 4; id(key_map_5) = 5; id(key_map_6) = 6;
          id(key_map_7) = 7; id(key_map_8) = 8;
          id(key_map_9) = 9;
          id(clear_learned_remote_keys)->execute();
          // clear BLE pairing + factory msg
          id(ble_remote_peer_bda) = "";
          lv_label_set_text(id(lbl_factory_msg), "");
          lv_obj_add_flag(id(lbl_factory_msg), LV_OBJ_FLAG_HIDDEN);

          // 同步到 HA
          id(max_volume_number)->publish_state(255.0f);
          id(power_on_limit_number)->publish_state(192.0f);
          id(balance_number)->publish_state(0.0f);
          id(display_brightness_number)->publish_state(80.0f);
          id(display_timeout_number)->publish_state(5.0f);
          id(theme_number)->publish_state(0.0f);
          id(auto_input_switch)->publish_state(true);

      - lvgl.page.show:
          id: main_page
          animation: LV_SCREEN_LOAD_ANIM_FADE_IN
          time: 200ms
      - lambda: |-
          lv_obj_move_foreground(id(lbl_factory_msg));
          lv_label_set_text(id(lbl_factory_msg), "已重置，请连接热点");
          lv_obj_remove_flag(id(lbl_factory_msg), LV_OBJ_FLAG_HIDDEN);
      - delay: 3s
      - lambda: |-
          wifi::global_wifi_component->save_wifi_sta("", "");
      - delay: 500ms
      - lambda: |-
          App.safe_reboot();

  # ── 待机：关屏 + 静音 + 暂停 LVGL，WiFi 保持连接（HA 可远程唤醒） ──
  - id: enter_standby
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(power_transitioning) || id(standby);'
          then:
            - lambda: |-
                ESP_LOGD("standby", "enter_standby skipped: transitioning=%d standby=%d",
                         id(power_transitioning) ? 1 : 0, id(standby) ? 1 : 0);
          else:
            - script.stop: display_idle_timer
            - script.stop: send_volume_to_pga
            - script.stop: switch_input
          # ── ① 软渐变静音 (如未静音) ──
          - if:
              condition:
                lambda: 'return !id(soft_mute);'
              then:
                - lambda: 'id(target_db) = -96.0f;'
                - script.execute: send_volume_to_pga
                - wait_until:
                    condition:
                      lambda: 'return id(current_db) <= -95.5f;'
                    timeout: 1500ms

            - lambda: |-
                id(power_transitioning) = true;
                id(standby_wake_block_until_ms) = millis() + 2500;
                id(saved_soft_mute) = id(soft_mute);
                id(soft_mute)       = true;
                id(target_db)       = -96.0f;
                id(current_db)      = -96.0f;
                id(mute_switch)->turn_on();
                auto off = id(display_backlight)->turn_off();
                off.set_transition_length(0);
                off.perform();
                pga2311::set_volume(0, 0);
                id(display_is_off)  = true;   // 同步显示状态
                id(system_ready)    = false;
                id(standby)         = true;
                id(standby_switch)->publish_state(false);  // HA 同步
                id(relay_in1)->turn_off();
                id(relay_in2)->turn_off();
                id(relay_in3)->turn_off();
                id(relay_in4)->turn_off();
                if (id(output_mode)) id(relay_out)->turn_off();
            - lvgl.pause:
            - delay: 100ms
            - lambda: |-
                id(power_transitioning) = false;

  # ── 退出待机 ──
  - id: exit_standby
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return !id(standby) || id(power_transitioning) || millis() < id(standby_wake_block_until_ms);'
          then:
            - lambda: |-
                ESP_LOGD("standby", "exit_standby skipped: transitioning=%d standby=%d",
                         id(power_transitioning) ? 1 : 0, id(standby) ? 1 : 0);
          else:
            - script.stop: display_idle_timer
            - script.stop: enter_standby
            - script.stop: send_volume_to_pga
            - script.stop: switch_input
            - lambda: |-
                id(power_transitioning) = true;
                id(standby)    = false;
                id(last_manual_input_ms) = 0;   // 退出待机 → 重新启用自动选择
                id(soft_mute)  = id(saved_soft_mute);
                id(current_db) = -96.0f;
                id(target_db)  = -96.0f;
                id(system_ready) = false;
                id(mute_switch)->turn_on();
                pga2311::set_volume(0, 0);
                if (id(volume_val) > id(power_on_limit)) id(volume_val) = id(power_on_limit);
                if (id(output_mode)) id(relay_out)->turn_on();
                id(standby_switch)->publish_state(true);  // HA 同步
            - light.turn_on:
                id: display_backlight
                transition_length: 800ms
                brightness: !lambda 'return id(display_brightness) / 100.0f;'
            - lvgl.resume:
            - delay: 2s
            - script.execute: switch_input
            - wait_until:
                condition:
                 lambda: 'return !id(switch_input)->is_running();'
            - script.execute: apply_theme    # ★ 待机恢复后应用主题色
            - lvgl.page.show: main_page
            - lambda: |-
                id(power_transitioning) = false;
                id(system_ready) = true;
                if (!id(soft_mute) && !id(temp_protect) && !id(ota_active)) id(mute_switch)->turn_off();
            - script.execute: send_volume_to_pga
            - script.execute: display_idle_timer

  - id: reset_idle_timer
    mode: restart
    then:
      - lambda: |-
          if (id(display_is_off) && !id(standby)) {
            auto call = id(display_backlight)->turn_on();
            call.set_brightness(id(display_brightness) / 100.0f);
            call.perform();
            id(display_is_off) = false;
          }
          id(last_display_interaction) = millis();
          id(last_idle_activity_ms) = millis();

  - id: display_idle_timer
    mode: restart
    then:
      - lambda: 'id(last_display_interaction) = millis();'
      - lambda: 'id(last_idle_activity_ms) = millis();'
      - while:
          condition:
            lambda: 'return !id(standby);'
          then:
            - delay: 1s
            - lambda: |-
                uint32_t now = millis();
                uint32_t elapsed = now - id(last_display_interaction);
                uint32_t timeout_ms = id(display_timeout_min) * 60000u;
                if (!id(display_is_off) && elapsed >= timeout_ms) {
                  auto call = id(display_backlight)->turn_on();
                  call.set_brightness(0.50f);
                  call.perform();
                  id(display_is_off) = true;
                }
                // Auto-standby: 1h no audio signal + no operation
                uint32_t idle_activity = now - id(last_idle_activity_ms);
                if (idle_activity >= 3600000u && !id(standby)) {
                  ESP_LOGI("standby", "Auto-standby: no signal+operation for 1 hour");
                  id(enter_standby)->execute();
                }

  - id: save_current_input_volume
    mode: restart
    parameters:
      input: int
      volume: int
    then:
      - lambda: |-
          if (!id(system_ready) || id(switching_input) || id(soft_mute)) return;
          int cur = input;
          int vol = volume;
          if (cur < 0 || cur > 3) return;
          if (vol < 0) vol = 0;
          if (vol > id(max_volume)) vol = id(max_volume);
          switch (cur) {
            case 0: id(input_vol_0) = vol; id(last_saved_vol_0) = vol; break;
            case 1: id(input_vol_1) = vol; id(last_saved_vol_1) = vol; break;
            case 2: id(input_vol_2) = vol; id(last_saved_vol_2) = vol; break;
            case 3: id(input_vol_3) = vol; id(last_saved_vol_3) = vol; break;
          }
          id(last_save_ms) = millis();
          ESP_LOGI("input_vol", "persist input=%d vol=%d slots=%d/%d/%d/%d",
                   cur, vol, id(input_vol_0), id(input_vol_1), id(input_vol_2), id(input_vol_3));

  - id: schedule_current_input_volume_save
    mode: restart
    parameters:
      input: int
      volume: int
    then:
      - delay: 2s
      - lambda: |-
          // Only persist after volume movement has settled. input_vol_0~3 use
          // restore_value, so writing them on every encoder tick would wear flash.
          if (!id(system_ready) || id(switching_input) || id(soft_mute)) return;
          id(save_current_input_volume)->execute(input, volume);

  - id: save_current_input_balance
    mode: restart
    parameters:
      input: int
      balance_value: int
    then:
      - lambda: |-
          if (!id(system_ready) || id(switching_input)) return;
          int cur = input;
          int bal = balance_value;
          if (cur < 0 || cur > 3) return;
          if (bal < -20) bal = -20;
          if (bal > 20) bal = 20;
          switch (cur) {
            case 0: id(input_bal_0) = bal; break;
            case 1: id(input_bal_1) = bal; break;
            case 2: id(input_bal_2) = bal; break;
            case 3: id(input_bal_3) = bal; break;
          }
          ESP_LOGI("input_bal", "save input=%d bal=%d slots=%d/%d/%d/%d",
                   cur, bal, id(input_bal_0), id(input_bal_1), id(input_bal_2), id(input_bal_3));

  # ══════════════════════════════════════════════════════════════
  # ★ V17 巅峰内核：双区间速度渐变 + 软锁释放
  # ══════════════════════════════════════════════════════════════
  - id: send_volume_to_pga
    mode: restart
    then:
      - lambda: |-
          if (id(ota_active) || id(temp_protect) || id(standby) || id(power_transitioning)) {
            id(current_db) = -96.0f;
            id(target_db)  = -96.0f;
            pga2311::set_volume(0, 0);
            return;
          }

          if (!id(switching_input)) {
            if (id(soft_mute)) {
              id(target_db) = -96.0f;
            } else {
              float reg_f = (float)id(volume_val);
              if (reg_f < 1.0f) {
                id(target_db) = -96.0f;
              } else {
                id(target_db) = (reg_f - 192.0f) * 0.5f;
              }
            }
          }

      - while:
          condition:
            lambda: |-
              if (id(ota_active) || id(temp_protect) || id(standby) || id(power_transitioning)) return false;
              return fabs(id(target_db) - id(current_db)) > 0.09f;
          then:
            - lambda: |-
                float diff = id(target_db) - id(current_db);
                float diff_abs = fabs(diff);
                float speed;

                if (diff_abs > 10.0f) {
                  speed = 0.12f;
                } else if (diff_abs > 3.0f) {
                  speed = 0.08f;
                } else {
                  speed = 0.18f;
                }

                id(current_db) += diff * speed;

                float db = id(current_db);
                int base_reg;
                if (db <= -95.5f) {
                  base_reg = 0;
                } else {
                  base_reg = (int)roundf(192.0f + db * 2.0f);
                  if (base_reg < 0)   base_reg = 0;
                  if (base_reg > 255) base_reg = 255;
                }

                int bal = id(balance);
                if (bal < -20) bal = -20;
                if (bal > 20)  bal = 20;

                // balance > 0 = 偏右：只衰减左声道
                // balance < 0 = 偏左：只衰减右声道
                int l_reg = base_reg;
                int r_reg = base_reg;

                if (bal > 0) {
                 l_reg -= bal;
                } else if (bal < 0) {
                 r_reg += bal;   // bal 为负数，所以这里等价于 r_reg - abs(bal)
                }

                // 完整限幅，防止未来算法调整后越界
                if (l_reg < 0)   l_reg = 0;
                if (l_reg > 255) l_reg = 255;
                if (r_reg < 0)   r_reg = 0;
                if (r_reg > 255) r_reg = 255;

                pga2311::set_volume(r_reg, l_reg);
            - delay: 15ms

      - lambda: |-
          if (id(ota_active) || id(temp_protect) || id(standby) || id(power_transitioning)) return;

          id(current_db) = id(target_db);

          float db = id(current_db);
          int base_reg;
          if (db <= -95.5f) {
            base_reg = 0;
          } else {
            base_reg = (int)roundf(192.0f + db * 2.0f);
            if (base_reg < 0)   base_reg = 0;
            if (base_reg > 255) base_reg = 255;
          }

                int bal = id(balance);
                if (bal < -20) bal = -20;
                if (bal > 20)  bal = 20;

                // balance > 0 = 偏右：只衰减左声道
                // balance < 0 = 偏左：只衰减右声道
                int l_reg = base_reg;
                int r_reg = base_reg;

                if (bal > 0) {
                 l_reg -= bal;
                } else if (bal < 0) {
                 r_reg += bal;   // bal 为负数，所以这里等价于 r_reg - abs(bal)
                }

                // 完整限幅，防止未来算法调整后越界
                if (l_reg < 0)   l_reg = 0;
                if (l_reg > 255) l_reg = 255;
                if (r_reg < 0)   r_reg = 0;
                if (r_reg > 255) r_reg = 255;

                pga2311::set_volume(r_reg, l_reg);

          float vol_pct = roundf((float)id(volume_val) * 100.0f / (float)id(max_volume));
          if (vol_pct > 100.0f) vol_pct = 100.0f;
          id(volume_number)->publish_state(vol_pct);
          id(balance_number)->publish_state((float)id(balance));
          float media_pct = (float)id(volume_val) / (float)id(max_volume);
          if (media_pct > 1.0f) media_pct = 1.0f;
          id(media_volume)->publish_state(media_pct * 100.0f);

  # ══════════════════════════════════════════════════════════════
  # 主题切换：更新所有界面控件颜色
  # ══════════════════════════════════════════════════════════════
  - id: apply_theme
    mode: single
    then:
      - lambda: |-
          lv_color_t accent = get_theme_accent(id(theme));
          // LEDs
          lv_led_set_color(id(led_src_0), accent);
          lv_led_set_color(id(led_src_1), accent);
          lv_led_set_color(id(led_src_2), accent);
          lv_led_set_color(id(led_src_3), accent);
          // 分隔线
          lv_obj_set_style_bg_color(id(separator), accent, LV_PART_MAIN);
          lv_obj_t* mini_specs[] = {
            id(mini_spec_0), id(mini_spec_1), id(mini_spec_2), id(mini_spec_3),
            id(mini_spec_4), id(mini_spec_5), id(mini_spec_6), id(mini_spec_7),
            id(mini_spec_8), id(mini_spec_9), id(mini_spec_10), id(mini_spec_11)
          };
          for (auto *o : mini_specs) lv_obj_set_style_bg_color(o, accent, LV_PART_MAIN);
          // dB 标签保持白色基调, 音量变化时由 UI 刷新段做轻微主题色脉冲
          lv_obj_set_style_text_color(id(lbl_vol_db), lv_color_hex(0xF8FAFC), LV_PART_MAIN);
          // 音量条指示器
          lv_obj_set_style_bg_color(id(bar_volume), accent, LV_PART_INDICATOR);
          // 温度计图标
          lv_obj_set_style_text_color(id(lbl_thermo_icon), accent, LV_PART_MAIN);
          // 温度数值
          lv_obj_set_style_text_color(id(lbl_temp_value), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_temp_unit), accent, LV_PART_MAIN);
          // 输出模式图标 (始终跟随主题色)
          lv_obj_set_style_text_color(id(lbl_out_transformer), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_out_direct), accent, LV_PART_MAIN);
          // 频谱页温度
          lv_obj_set_style_text_color(id(lbl_spec_temp), accent, LV_PART_MAIN);
          // 手机 APP BLE 图标 (仅连接时跟随主题)
          if (id(ble_connected))
            lv_obj_set_style_text_color(id(lbl_ble), accent, LV_PART_MAIN);
          // 蓝牙遥控器指示图标 (仅连接时跟随主题)
          if (id(ble_remote_connected))
            lv_obj_set_style_text_color(id(lbl_ble_remote_indicator), accent, LV_PART_MAIN);
          // WiFi 图标 (仅连接时跟随主题)
          if (wifi::global_wifi_component->is_connected())
            lv_obj_set_style_text_color(id(lbl_wifi), accent, LV_PART_MAIN);
          {
            lv_color_t dim = lv_color_hex(0x64748B);
            bool wifi_ok = wifi::global_wifi_component->is_connected();
            bool ble_ok = id(ble_connected) && !id(ble_remote_connected);
            bool remote_ok = id(ble_remote_connected);
            bool mute_ok = id(soft_mute);
            lv_obj_set_style_opa(id(lbl_thermo_icon), LV_OPA_70, LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_temp_value), LV_OPA_80, LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_temp_unit), LV_OPA_60, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_mute), mute_ok ? lv_color_hex(0xEF4444) : lv_color_hex(0x6B7280), LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_mute), mute_ok ? LV_OPA_COVER : LV_OPA_70, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_wifi), wifi_ok ? accent : dim, LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_wifi), wifi_ok ? LV_OPA_90 : LV_OPA_60, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_ble), ble_ok ? accent : dim, LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_ble), ble_ok ? LV_OPA_90 : LV_OPA_60, LV_PART_MAIN);
            lv_obj_set_style_text_color(id(lbl_ble_remote_indicator), remote_ok ? accent : dim, LV_PART_MAIN);
            lv_obj_set_style_opa(id(lbl_ble_remote_indicator), remote_ok ? LV_OPA_90 : LV_OPA_60, LV_PART_MAIN);
            lv_obj_set_style_border_color(id(ble_remote_batt_outline), remote_ok ? accent : dim, LV_PART_MAIN);
            lv_obj_set_style_opa(id(ble_remote_batt_outline), remote_ok ? LV_OPA_90 : LV_OPA_50, LV_PART_MAIN);
          }
          lv_obj_set_style_text_color(id(lbl_main_active_input), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_main_output_value), lv_color_mix(accent, lv_color_hex(0xE5E7EB), 176), LV_PART_MAIN);
          lv_obj_set_style_text_color(id(lbl_main_auto_value), lv_color_mix(accent, lv_color_hex(0xE5E7EB), 176), LV_PART_MAIN);
          {
            int cur = id(current_input);
            if (cur < 0 || cur > 3) cur = 0;
            bool sigs[] = {id(audio_cd)->state, id(audio_dac)->state, id(audio_pc)->state, id(audio_aux)->state};
            lv_obj_t* cards[] = {id(src_card_0), id(src_card_1), id(src_card_2), id(src_card_3)};
            lv_obj_t* icons_lbl[] = {id(lbl_src_radio), id(lbl_src_gamepad), id(lbl_src_laptop), id(lbl_src_music)};
            lv_obj_t* names_lbl[] = {id(lbl_src_name_0), id(lbl_src_name_1), id(lbl_src_name_2), id(lbl_src_name_3)};
            lv_obj_t* states_lbl[] = {id(lbl_src_state_0), id(lbl_src_state_1), id(lbl_src_state_2), id(lbl_src_state_3)};
            const char* state_text[] = {"IDLE", "SIGNAL"};
            for (int i = 0; i < 4; i++) {
              bool selected = (i == cur);
              bool mcp_signal = sigs[i];

              lv_obj_set_style_bg_color(cards[i],
                selected ? lv_color_hex(0x0B1420) : lv_color_hex(0x08121E), LV_PART_MAIN);
              lv_obj_set_style_bg_opa(cards[i], selected ? LV_OPA_50 : LV_OPA_20, LV_PART_MAIN);
              lv_obj_set_style_border_color(cards[i], selected ? accent : lv_color_hex(0x263244), LV_PART_MAIN);
              lv_obj_set_style_border_opa(cards[i], selected ? LV_OPA_90 : LV_OPA_70, LV_PART_MAIN);

              lv_color_t icon_color = mcp_signal ? accent : lv_color_hex(0x334155);
              lv_color_t name_color = lv_color_hex(0xF8FAFC);
              lv_color_t state_color = mcp_signal ? accent : lv_color_hex(0x475569);
              lv_obj_set_style_text_color(icons_lbl[i], icon_color, LV_PART_MAIN);
              lv_obj_set_style_text_color(names_lbl[i], name_color, LV_PART_MAIN);
              lv_label_set_text(states_lbl[i], state_text[mcp_signal ? 1 : 0]);
              lv_obj_set_style_text_color(states_lbl[i], state_color, LV_PART_MAIN);
            }
          }
          // 设置页进度条指示器
          lv_obj_set_style_bg_color(id(bar_max_vol), accent, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(bar_power_on_limit), accent, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(bar_balance), accent, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(bar_brightness), accent, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(bar_display_timeout), accent, LV_PART_INDICATOR);
          // VU 电平表指示器 (之前漏掉，导致主题切换时 VU 表不变色)
          lv_obj_set_style_bg_color(id(vu_meter_l), accent, LV_PART_INDICATOR);
          lv_obj_set_style_bg_color(id(vu_meter_r), accent, LV_PART_INDICATOR);
          // 主题色点
          lv_obj_set_style_bg_color(id(theme_dot), accent, LV_PART_MAIN);
          // 设置页图标 (rows 0-7 跟随主题, 10 输出模式跟随主题, 8-9 蓝牙/按键导航, 11-12 固定灰)
          lv_obj_set_style_text_color(id(icon_max_vol), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_power_on), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_balance), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_input), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_auto_switch), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_brightness), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_timeout), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_theme), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_output_mode), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_spectrum_auto), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_spectrum_theme), accent, LV_PART_MAIN);
          lv_obj_set_style_text_color(id(icon_ble_remote), accent, LV_PART_MAIN);
