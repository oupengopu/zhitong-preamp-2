  # ══════════════════════════════════════════════════════════════
  # 设置页状态同步：HA/编码器/BLE 修改全局变量后，统一刷新 LVGL 行值
  # ══════════════════════════════════════════════════════════════
  - id: sync_settings_ui
    mode: restart
    then:
      - lambda: |-
          lv_bar_set_value(id(bar_max_vol), id(max_volume), LV_ANIM_OFF);
          lv_label_set_text(id(val_max_vol), std::to_string(id(max_volume)).c_str());

          lv_bar_set_value(id(bar_power_on_limit), id(power_on_limit), LV_ANIM_OFF);
          lv_label_set_text(id(val_power_on), std::to_string(id(power_on_limit)).c_str());

          int bal = id(balance);
          if (bal < -20) bal = -20;
          if (bal > 20) bal = 20;
          lv_bar_set_value(id(bar_balance), bal + 20, LV_ANIM_OFF);
          {
            char buf[8];
            if (bal == 0) {
              lv_label_set_text(id(val_balance), "平衡");
            } else {
              snprintf(buf, sizeof(buf), "%s%d", bal < 0 ? "L" : "R", abs(bal));
              lv_label_set_text(id(val_balance), buf);
            }
          }

          {
            const char* names[] = {"CD", "DAC", "PC", "AUX"};
            int cur = id(current_input);
            if (cur < 0 || cur > 3) cur = 0;
            lv_label_set_text(id(val_input), names[cur]);
          }

          lv_label_set_text(id(val_auto_switch), id(auto_input) ? "自动" : "手动");

          lv_bar_set_value(id(bar_brightness), id(display_brightness), LV_ANIM_OFF);
          {
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", id(display_brightness));
            lv_label_set_text(id(val_brightness), buf);
          }

          lv_bar_set_value(id(bar_display_timeout), id(display_timeout_min), LV_ANIM_OFF);
          {
            char buf[12];
            snprintf(buf, sizeof(buf), "%d分钟", id(display_timeout_min));
            lv_label_set_text(id(val_timeout), buf);
          }

          {
            int th = id(theme);
            if (th < 0 || th > 7) th = 0;
            lv_label_set_text(id(val_theme), get_theme_name(th));
            lv_obj_set_style_bg_color(id(theme_dot), get_theme_accent(th), LV_PART_MAIN);
          }

          lv_label_set_text(id(val_output_mode), id(output_mode) ? "直通" : "变压器");
          lv_label_set_text(id(lbl_main_output_value), id(output_mode) ? "DIRECT" : "TRANSFORMER");
          lv_obj_add_flag(id(lbl_out_transformer), LV_OBJ_FLAG_HIDDEN);
