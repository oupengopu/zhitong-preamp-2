      # ── MADCTL/rotation 交给 LVGL + mipi_spi 驱动设置，避免覆盖硬件旋转 ──
      # ── Sleep Out ──
      - [0x11]
      - delay 220ms
      # ── Display On ──
      - [0x29]

# ═══════════════════════════════════════════════════════════════
# LVGL 图形框架 — 性能极限配置
#   buffer_size=100%: 全帧缓冲 (428×142×2=121KB), PSRAM 容纳, 零撕裂
#   partial_refresh: 仅传输脏区, 80MHz SPI 下脏区刷新 ~3-6ms (vs 25%缓冲多次分段刷新)
# ═══════════════════════════════════════════════════════════════
lvgl:
  displays:
    - tft_display
  rotation: 270
  encoders:
    - sensor: volume_encoder
      enter_button: encoder_button
      long_press_time: 30000ms  # LVGL 长按禁用: 由 binary_sensor on_multi_click 1500ms/10000ms 处理
  buffer_size: 100%
  color_depth: 16
  theme:
    dark_mode: true
  default_font: font_cn_small

  on_resume:
    then:
      # 先刷新数据, 再亮屏 — 避免唤醒瞬间显示旧数据 (频谱冻结/温度过时)
      - lambda: |-
          if (!id(standby)) {
            // 不调用 msgeq7::read() — interval 50ms 会统一处理
            msgeq7::read_ntc();
            float _ntc = msgeq7::get_temperature();
            if (msgeq7::is_temperature_valid(_ntc)) {
              id(ntc_temp)->publish_state(_ntc);
            }
          }
      - if:
          condition:
            lambda: 'return !id(standby);'
          then:
            - light.turn_on:
                id: display_backlight
                transition_length: 500ms
                brightness: !lambda 'return id(display_brightness) / 100.0f;'
            - globals.set: {id: display_is_off, value: 'false'}

  pages:
    # ── 开机闪屏: Zhitong Audio Logo 渐显 (WiFi 就绪后切到主页面) ──
    - id: splash_page
      bg_color: 0x050510
      widgets:
        # Zhitong Audio 品牌标题
        - label:
            id: lbl_splash_title
            x: 0
            y: 42
            width: 428
            height: 42
            text: "Zhitong Audio"
            text_font: montserrat_36
            text_align: CENTER
            text_color: !lambda |-
              return get_theme_accent(id(theme));
        # 副标题
        - label:
            id: lbl_splash_sub
            x: 0
            y: 84
            width: 428
            height: 22
            text: "智能前级2.0"
            text_font: font_cn
            text_align: CENTER
            text_color: 0x8E9FB8
        # 版本号底部
        - label:
            id: lbl_splash_ver
            x: 0
            y: 126
            width: 428
            height: 12
            text: "v${firmware_version}"
            text_font: montserrat_8
            text_align: CENTER
            text_color: 0x4A6890

    # ── 主页面：SquareLine 绿色风格 428×142 ──
    - id: main_page
      bg_color: 0x0A1220
      widgets:
        # Modern fixed-coordinate instrument layout (428x142 TFT)
