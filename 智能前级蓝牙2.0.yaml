substitutions:
  device_name: zhitong-preamp-2
  friendly_name: "智能前级2.0"
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_ssid: !secret ap_ssid
  ap_password: !secret ap_password
  ota_password: !secret ota_password
  api_key: !secret api_key
  firmware_version: "v2.1.5"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  platformio_options:
    build_flags:
      - -DUSE_ESP32_BLE_CLIENT
      - -DESPHOME_ESP32_BLE_GAP_EVENT_HANDLER_COUNT=1
      - -DESPHOME_ESP32_BLE_GAP_SCAN_EVENT_HANDLER_COUNT=1
      - -DESPHOME_ESP32_BLE_GATTC_EVENT_HANDLER_COUNT=1
  includes:
    - PGA/pga2311.h
    - PGA/msgeq7.h
    - PGA/lvgl_compat.h
    - PGA/settings_ui.h
    - PGA/ble_hid_host.h
    - PGA/remote_keys.h

  on_boot:
    # priority 200 -> -100 严格串行: 硬件初始化先于软件恢复
    # 若顺序颠倒会导致 SPI/ADC 未就绪时写入数据
    - priority: 200
      then:
        - lambda: |-
            ESP_LOGI("BOOT_DIAG", "boot start: reset_reason=%d heap=%u", (int)esp_reset_reason(), (unsigned)esp_get_free_heap_size());
            ESP_LOGD("PGA2311", "Initializing SPI3 and PGA2311 at priority 200");
            pga2311::setup();
            pga2311::set_volume(0, 0);
            msgeq7::setup();
            ESP_LOGI("BOOT_DIAG", "hardware init done: heap=%u", (unsigned)esp_get_free_heap_size());

    - priority: 150
      then:
        - lambda: |-
            ESP_LOGD("BLE_HID", "Initializing BLE HID Host at priority 150");
            ble_hid_host::setup(id(ble_hub));
            ESP_LOGI("BOOT_DIAG", "ble hid init done: heap=%u", (unsigned)esp_get_free_heap_size());

    - priority: -100
      then:
        - lambda: |-
            ESP_LOGI("BOOT_DIAG", "state restore start: heap=%u", (unsigned)esp_get_free_heap_size());
            // v2.1.0+ 迁移: 旧固件 volume_val 是 max_volume 百分比, 新固件直接映射 PGA 寄存器
            // 换算公式: reg = old_val / old_max * 255
            //
            // ⚠️ 顺序依赖: input_vol_0~3 的 scale 换算必须先于下方 switch(current_input)
            // 中从 input_vol_* 取值赋给 volume_val。current_input 越界会先 clamp 到 0，
            // 然后取已迁移的 input_vol_0，逻辑正确但依赖顺序，切勿重排。
            if (!id(v210_migrated) && id(max_volume) > 0) {
              float scale = 255.0f / (float)id(max_volume);
              id(input_vol_0) = std::min((int)((float)id(input_vol_0) * scale), 255);
              id(input_vol_1) = std::min((int)((float)id(input_vol_1) * scale), 255);
              id(input_vol_2) = std::min((int)((float)id(input_vol_2) * scale), 255);
              id(input_vol_3) = std::min((int)((float)id(input_vol_3) * scale), 255);
              if (id(max_volume) < 255) id(max_volume) = 255;
              if (id(power_on_limit) < 192) id(power_on_limit) = 192;
              id(v210_migrated) = true;
              ESP_LOGI("boot", "v2.1.0+ migrate: volume values rescaled (factor=%.3f)", scale);
            }

            if (id(current_input) < 0 || id(current_input) > 3) id(current_input) = 0;
            id(active_input) = id(current_input);
            if (id(max_volume) < 10 || id(max_volume) > 255) id(max_volume) = 255;
            if (id(power_on_limit) < 10 || id(power_on_limit) > 255) id(power_on_limit) = 192;
            if (id(power_on_limit) > id(max_volume)) id(power_on_limit) = id(max_volume);
            if (id(balance) < -20 || id(balance) > 20) id(balance) = 0;
            if (!id(v211_balance_migrated)) {
              id(input_bal_0) = id(balance);
              id(input_bal_1) = id(balance);
              id(input_bal_2) = id(balance);
              id(input_bal_3) = id(balance);
              id(v211_balance_migrated) = true;
              ESP_LOGI("boot", "v2.1.1 migrate: input balance slots initialized to %d", id(balance));
            }
            if (id(input_bal_0) < -20 || id(input_bal_0) > 20) id(input_bal_0) = 0;
            if (id(input_bal_1) < -20 || id(input_bal_1) > 20) id(input_bal_1) = 0;
            if (id(input_bal_2) < -20 || id(input_bal_2) > 20) id(input_bal_2) = 0;
            if (id(input_bal_3) < -20 || id(input_bal_3) > 20) id(input_bal_3) = 0;
            if (id(display_timeout_min) < 1 || id(display_timeout_min) > 60) id(display_timeout_min) = 5;
            if (id(display_brightness) < 0 || id(display_brightness) > 100) id(display_brightness) = 80;
            if (id(spectrum_auto_seconds) < 0 || id(spectrum_auto_seconds) > 60) id(spectrum_auto_seconds) = 15;
            if (id(spectrum_theme) < 0 || id(spectrum_theme) > 5) id(spectrum_theme) = 2;
            if (id(volume_val) < 0) id(volume_val) = 0;
            id(register_learned_remote_keys)->execute();

            id(current_db) = -96.0f;
            id(target_db)  = -96.0f;

            switch (id(current_input)) {
              case 0: id(volume_val) = id(input_vol_0); break;
              case 1: id(volume_val) = id(input_vol_1); break;
              case 2: id(volume_val) = id(input_vol_2); break;
              case 3: id(volume_val) = id(input_vol_3); break;
            }
            switch (id(current_input)) {
              case 0: id(balance) = id(input_bal_0); break;
              case 1: id(balance) = id(input_bal_1); break;
              case 2: id(balance) = id(input_bal_2); break;
              case 3: id(balance) = id(input_bal_3); break;
            }
            if (id(volume_val) > id(max_volume)) id(volume_val) = id(max_volume);
            if (id(volume_val) > id(power_on_limit)) id(volume_val) = id(power_on_limit);

            id(last_saved_vol_0) = id(input_vol_0);
            id(last_saved_vol_1) = id(input_vol_1);
            id(last_saved_vol_2) = id(input_vol_2);
            id(last_saved_vol_3) = id(input_vol_3);

            id(max_volume_number)->publish_state((float)id(max_volume));
            id(power_on_limit_number)->publish_state((float)id(power_on_limit));
            id(balance_number)->publish_state((float)id(balance));
            id(display_timeout_number)->publish_state((float)id(display_timeout_min));
            id(display_brightness_number)->publish_state((float)id(display_brightness));
            id(theme_number)->publish_state((float)id(theme));
            id(auto_input_switch)->publish_state(id(auto_input));

            const char* names[] = {"CD", "DAC", "PC", "AUX"};
            id(input_select)->publish_state(names[id(current_input)]);
            id(standby_switch)->publish_state(!id(standby));

            // 初始化输出继电器状态 (GPA4)
            if (id(output_mode))
              id(relay_out)->turn_on();
            else
              id(relay_out)->turn_off();

            id(power_transitioning) = !id(standby);
            id(system_ready) = false;
            id(mute_switch)->turn_on();
            pga2311::set_volume(0, 0);
            ESP_LOGI("BOOT_DIAG", "system_ready=false before boot input switch: heap=%u", (unsigned)esp_get_free_heap_size());

        - if:
            condition:
              lambda: 'return !id(standby);'
            then:
              - lambda: |-
                  float boot_pct = (float)id(volume_val) * 100.0f / (float)id(max_volume);
                  if (boot_pct > 100.0f) boot_pct = 100.0f;
                  id(volume_number)->publish_state(boot_pct);
              - script.execute: switch_input
              - wait_until:
                  condition:
                    lambda: 'return !id(switch_input)->is_running();'
                  timeout: 5000ms
              - lambda: |-
                  ESP_LOGI("BOOT_DIAG", "switch_input complete: heap=%u", (unsigned)esp_get_free_heap_size());
              - script.execute: apply_theme    # ★ 上电后应用保存的主题色
              - lvgl.resume:
              - lvgl.page.show: splash_page
              - lambda: |-
                  lv_obj_invalidate(lv_scr_act());
                  lv_refr_now(NULL);
                  auto call = id(display_backlight)->turn_on();
                  call.set_brightness(id(display_brightness) / 100.0f);
                  call.perform();
                  ESP_LOGI("BOOT_DIAG", "boot splash shown via lvgl action: heap=%u", (unsigned)esp_get_free_heap_size());

        - if:
            condition:
              lambda: 'return id(standby);'
            then:
              - lambda: |-
                  id(soft_mute) = true;
                  pga2311::set_volume(0, 0);
                  id(current_db) = -96.0f;
                  id(target_db)  = -96.0f;
                  id(system_ready) = false;
                  id(power_transitioning) = false;
              - switch.turn_on: mute_switch

    - priority: -200
      then:
        - delay: 20s
        - safe_mode.mark_successful:
        - lambda: |-
            ESP_LOGI("BOOT_DIAG", "safe_mode marked successful: heap=%u", (unsigned)esp_get_free_heap_size());

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  partitions: partitions.csv
  framework:
    type: esp-idf
    advanced:
      include_builtin_idf_components:
        - esp_adc
    sdkconfig_options:
      # ═══ ESP32-S3 性能极限配置 ═══
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"       # CPU 锁定 240MHz (默认可能降频 160MHz)
      CONFIG_ESP32S3_SPIRAM_SUPPORT: "y"               # PSRAM 支持
      CONFIG_SPIRAM_MODE_OCT: "y"                       # 八线 PSRAM
      CONFIG_SPIRAM_SPEED_80M: "y"                      # PSRAM 80MHz
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"             # ★ 从 PSRAM 取指令 (释放 Flash 带宽给 LVGL 字体渲染)
      CONFIG_SPIRAM_RODATA: "y"                         # ★ 从 PSRAM 读取只读数据 (字体 glyph 不再抢 Flash)
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"           # ★ 数据缓存行 64B (默认 32B, 翻倍提升 DMA/PSRAM 命中率)
      CONFIG_ESP32S3_INSTRUCTION_CACHE_LINE_64B: "y"    # ★ 指令缓存行 64B (提升高频调用函数缓存命中)
      CONFIG_LV_USE_DRAW_SW_ASM: "y"                    # LVGL 使用 ESP32-S3 SIMD 指令加速渲染
      CONFIG_LV_DRAW_SW_ASM_ASSUME_VFP: "y"            # 使用硬件 FPU 加速浮点渲染
      CONFIG_SPIRAM_USE_MALLOC: "y"                     # 允许 malloc 使用 PSRAM (大缓冲区自动进 PSRAM)
      CONFIG_ESP32S3_DATA_CACHE_SIZE_64KB: "y"          # ★ 数据缓存 64KB (默认 32KB, 大幅减少 PSRAM 未命中)
      CONFIG_ESP32S3_INSTRUCTION_CACHE_SIZE_32KB: "y"   # 指令缓存 32KB (默认 16KB)
      CONFIG_GATTC_ENABLE: "y"                          # 启用 GATT Client (BLE HID Host 遥控器支持)
psram:
  mode: octal
  speed: 80MHz

esp32_ble:
  id: ble_hub
  io_capability: none
  max_connections: 3

esp32_ble_server:
  ble_id: ble_hub
  manufacturer: "Zhitong Audio"
  model: "PreAmp 2.0"
  on_connect:
    - lambda: 'id(ble_connected) = true;'
  on_disconnect:
    - lambda: 'id(ble_connected) = false;'
  services:
    - uuid: "0000FFE0-0000-1000-8000-00805F9B34FB"
      advertise: true
      characteristics:
        - id: ble_notify_char
          uuid: "0000FFE2-0000-1000-8000-00805F9B34FB"
          notify: true
          read: true
        - id: ble_write_char
          uuid: "0000FFE1-0000-1000-8000-00805F9B34FB"
          write: true
          write_no_response: true
          on_write:
            then:
              - lambda: |-
                  if (x.size() < 4 || x[0] != 0xAA) {
                    return;
                  }
                  uint8_t cmd = x[1];
                  uint8_t len = x[2];
                  if (x.size() < 4 + len + 1) {  // +1 确保CRC字节存在
                    return;
                  }
                  uint8_t crc = cmd ^ len;
                  for(int i=0; i<len; i++) crc ^= x[3+i];
                  if (crc != x[3+len]) {  // x[3+len] 是紧接 payload 后的 CRC 字节
                    return;
                  }

                  auto make_status = [&]() -> std::vector<uint8_t> {
                    uint8_t temp_int = 0;
                    if (id(ntc_temp)->has_state()) temp_int = (uint8_t)std::min(std::max((int)round(id(ntc_temp)->state), 0), 127);
                    std::vector<uint8_t> payload = {
                      (uint8_t)id(volume_val),
                      (uint8_t)(id(soft_mute) ? 0x01 : 0x00),
                      (uint8_t)id(current_input),
                      (uint8_t)(id(balance) + 20),
                      temp_int,
                      (uint8_t)id(max_volume),
                      (uint8_t)(id(standby) ? 0x01 : 0x00),
                      (uint8_t)id(power_on_limit),
                      (uint8_t)id(display_timeout_min),
                      (uint8_t)(id(auto_input) ? 0x01 : 0x00)  // byte 9: 自动输入切换
                    };
                    uint8_t p_len = payload.size();
                    uint8_t p_cmd = 0x80;
                    uint8_t p_crc = p_cmd ^ p_len;
                    for (uint8_t b : payload) p_crc ^= b;

                    std::vector<uint8_t> frame = {0xBB, p_cmd, p_len};
                    frame.insert(frame.end(), payload.begin(), payload.end());
                    frame.push_back(p_crc);
                    return frame;
                  };

                  if (!id(system_ready) && cmd != 0x06 && cmd != 0x10) return;

                  uint32_t now = millis();
                  if (cmd == 0x01 || cmd == 0x04) {
                    if (now - id(last_control_ms) < 30) return;
                    id(last_control_ms) = now;
                  }

                  switch (cmd) {
                    case 0x01: {
                      if (len < 1 || id(switching_input)) break;
                      uint8_t vol = x[3];
                      if (vol > id(max_volume)) vol = id(max_volume);
                      id(volume_val) = vol;
                      id(last_v_change_ms) = now;

                      float pct = (float)vol * 100.0f / (float)id(max_volume);
                      if (pct > 100.0f) pct = 100.0f;
                      id(volume_number)->publish_state(pct);
                      id(schedule_current_input_volume_save)->execute(id(current_input), id(volume_val));
                      id(send_volume_to_pga)->execute();
                      id(reset_idle_timer)->execute();
                      break;
                    }
                    case 0x02: {
                      if (len < 1) break;
                      bool mute = x[3] == 0x01;
                      if (mute != id(soft_mute)) {
                        if (mute) id(soft_mute_switch)->turn_on();
                        else      id(soft_mute_switch)->turn_off();
                      }
                      break;
                    }
                    case 0x03: {
                      if (len < 1) break;
                      if (id(switching_input)) break;
                      uint8_t input = x[3];
                      if (input > 3) break;
                      if (now - id(last_switch_ms) < 1500) break;
                      if (id(current_input) != input) {
                        id(last_switch_ms) = now;
                        id(last_manual_input_ms) = now;
                        id(current_input) = input;
                        const char* names[] = {"CD", "DAC", "PC", "AUX"};
                        id(input_select)->publish_state(names[input]);
                        id(switch_input)->execute();
                      }
                      id(reset_idle_timer)->execute();
                      break;
                    }
                    case 0x04: {
                      if (len < 1) break;
                      int bal = (int)x[3] - 20;  // x[3] 范围 0-40 映射到 -20~20
                      if (bal < -20) bal = -20;
                      if (bal > 20)  bal = 20;
                      id(balance) = bal;
                      id(save_current_input_balance)->execute(id(current_input), id(balance));
                      id(balance_number)->publish_state((float)bal);
                      id(send_volume_to_pga)->execute();
                      id(reset_idle_timer)->execute();
                      // 同步 LVGL 设置页
                      lv_bar_set_value(id(bar_balance), bal + 20, LV_ANIM_OFF);
                      {
                        char buf[8];
                        if (bal == 0) lv_label_set_text(id(val_balance), "平衡");
                        else { snprintf(buf, sizeof(buf), "%s%d", bal < 0 ? "L" : "R", bal < 0 ? -bal : bal);
                          lv_label_set_text(id(val_balance), buf); }
                      }
                      break;
                    }
                    case 0x05: {
                      if (len < 1) break;
                      uint8_t max_vol = x[3];
                      if (max_vol < 10)  max_vol = 10;
                      if (max_vol > 255) max_vol = 255;
                      id(max_volume) = max_vol;
                      if (id(power_on_limit) > max_vol) {
                        id(power_on_limit) = max_vol;
                        id(power_on_limit_number)->publish_state((float)max_vol);
                        lv_bar_set_value(id(bar_power_on_limit), max_vol, LV_ANIM_OFF);
                        lv_label_set_text(id(val_power_on), (std::to_string(max_vol)).c_str());
                      }
                      if (id(volume_val) > max_vol) {
                         id(volume_val) = max_vol;
                         id(last_v_change_ms) = now;
                      }
                      id(max_volume_number)->publish_state((float)max_vol);
                      float pct = (float)id(volume_val) * 100.0f / (float)id(max_volume);
                      if (pct > 100.0f) pct = 100.0f;
                      id(volume_number)->publish_state(pct);
                      id(send_volume_to_pga)->execute();
                      // 同步 LVGL 设置页
                      lv_bar_set_value(id(bar_max_vol), max_vol, LV_ANIM_OFF);
                      lv_label_set_text(id(val_max_vol), (std::to_string(max_vol)).c_str());
                      break;
                    }
                    case 0x06: {
                      if (len < 1) break;
                      bool want_standby = x[3] == 0x01;
                      if (want_standby && !id(standby))  id(standby_switch)->turn_off();
                      else if (!want_standby && id(standby)) id(standby_switch)->turn_on();
                      break;
                    }
                    case 0x07: {
                      id(media_select)->publish_state("播放");
                      id(media_reset)->execute();
                      break;
                    }
                    case 0x0A: {
                      id(media_select)->publish_state("暂停");
                      id(media_reset)->execute();
                      break;
                    }
                    case 0x08: {
                      id(media_select)->publish_state("下一首");
                      id(media_reset)->execute();
                      break;
                    }
                    case 0x09: {
                      id(media_select)->publish_state("上一首");
                      id(media_reset)->execute();
                      break;
                    }
                    case 0x0B: {
                      if (!id(standby)) break;
                      id(standby_switch)->turn_on();
                      break;
                    }
                    case 0x0C: {
                      if (id(standby)) break;
                      id(standby_switch)->turn_off();
                      break;
                    }
                    case 0x0D: {
                      if (len < 1) break;
                      uint8_t pol = x[3];
                      if (pol < 10)  pol = 10;
                      if (pol > id(max_volume)) pol = id(max_volume);
                      id(power_on_limit) = pol;
                      id(power_on_limit_number)->publish_state((float)pol);
                      // 同步 LVGL 设置页
                      lv_bar_set_value(id(bar_power_on_limit), pol, LV_ANIM_OFF);
                      lv_label_set_text(id(val_power_on), (std::to_string(pol)).c_str());
                      break;
                    }
                    case 0x0E: {
                      if (len < 1) break;
                      uint8_t tm = x[3];
                      if (tm < 1)  tm = 1;
                      if (tm > 60) tm = 60;
                      id(display_timeout_min) = tm;
                      id(display_timeout_number)->publish_state((float)tm);
                      // 同步 LVGL 设置页
                      lv_bar_set_value(id(bar_display_timeout), tm, LV_ANIM_OFF);
                      {
                        char buf[8];
                        snprintf(buf, sizeof(buf), "%d分钟", tm);
                        lv_label_set_text(id(val_timeout), buf);
                      }
                      break;
                    }
                    case 0x0F: {
                      if (len < 1) break;
                      bool auto_en = x[3] == 0x01;
                      id(auto_input) = auto_en;
                      if (auto_en) id(auto_input_switch)->turn_on();
                      else         id(auto_input_switch)->turn_off();
                      if (id(val_auto_switch)) lv_label_set_text(id(val_auto_switch), auto_en ? "自动" : "手动");
                      break;
                    }
                    case 0x10: {
                      id(ble_notify_char)->set_value(make_status());
                      id(ble_notify_char)->notify();
                      return;
                    }
                    default: {
                      uint8_t n_crc = 0x81 ^ 0x02 ^ cmd ^ 0x00;
                      id(ble_notify_char)->set_value({0xBB, 0x81, 0x02, cmd, 0x00, n_crc});
                      id(ble_notify_char)->notify();
                      return;
                    }
                  }

                  uint8_t a_cmd = 0x81;
                  uint8_t a_len = 0x02;
                  uint8_t a_crc = a_cmd ^ a_len ^ cmd ^ 0x01;
                  id(ble_notify_char)->set_value({0xBB, a_cmd, a_len, cmd, 0x01, a_crc});
                  id(ble_notify_char)->notify();

logger:
  level: INFO
  # Real-machine USB debug uses the ESP32-S3 USB-Serial-JTAG port (COM7).
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: ${api_key}
  services:
    - service: set_volume
      variables:
        vol: float
      then:
        - lambda: |-
            if (!id(system_ready) || id(switching_input)) return;
            uint32_t now = millis();
            if (now - id(last_control_ms) < 30) return;
            id(last_control_ms) = now;

            int v = (int)(vol * id(max_volume));
            if (v < 0) v = 0;
            if (v > id(max_volume)) v = id(max_volume);
            id(volume_val) = v;
            id(last_v_change_ms) = now;
            id(schedule_current_input_volume_save)->execute(id(current_input), id(volume_val));
            id(send_volume_to_pga)->execute();
            id(reset_idle_timer)->execute();

    - service: set_mute
      variables:
        muted: bool
      then:
        - lambda: |-
            if (!id(system_ready)) return;
            id(soft_mute) = muted;
            if (muted) id(mute_switch)->turn_on();
            else       id(mute_switch)->turn_off();
            id(send_volume_to_pga)->execute();
            id(reset_idle_timer)->execute();

    - service: set_input
      variables:
        input_name: string
      then:
        - lambda: |-
            if (!id(system_ready) || id(switching_input)) return;
            uint32_t now = millis();
            if (now - id(last_switch_ms) < 1500) return;
            int target = -1;
            if      (input_name == "CD")  target = 0;
            else if (input_name == "DAC") target = 1;
            else if (input_name == "PC")  target = 2;
            else if (input_name == "AUX") target = 3;
            if (target < 0) return;
            id(last_switch_ms) = now;
            id(last_manual_input_ms) = now;
            id(current_input) = target;
            id(switch_input)->execute();
            id(reset_idle_timer)->execute();
    - service: recalibrate_msgeq7
      then:
        - lambda: |-
            if (!id(system_ready)) return;
            bool ok = msgeq7::recalibrate();
            ESP_LOGI("main", "MSGEQ7 recalibrate: %s", ok ? "OK" : "FAILED");

ota:
  - platform: esphome
    password: ${ota_password}
    on_begin:
      - lambda: |-
          id(ota_active) = true;
          id(current_db) = -96.0f;
          id(target_db)  = -96.0f;
          pga2311::set_volume(0, 0);
    on_end:
      - lambda: 'id(ota_active) = false;'
    on_error:
      - lambda: 'id(ota_active) = false;'

safe_mode:
  boot_is_good_after: 20s
  num_attempts: 10
  reboot_timeout: 5min

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  ap:
    ssid: ${ap_ssid}
    password: ${ap_password}

captive_portal:
web_server:
  port: 80

# ═══════════════════════════════════════════════════════════════
# SPI 总线 — NV3007 TFT 显示 (ESPHome SPI2_HOST, 与 PGA2311 SPI3_HOST 无冲突)
# ═══════════════════════════════════════════════════════════════
# ESP32-S3 SPI2_HOST 支持 DMA, 80MHz 时自动启用 (传输期间 CPU 空闲)
# TFT: SDA=IO4, SCLK=IO5 (CS=GND 常选)
# ═══════════════════════════════════════════════════════════════
spi:
  - id: display_spi
    clk_pin: GPIO5
    mosi_pin: GPIO4
    

# ═══════════════════════════════════════════════════════════════
# I2C 总线 — MCP23017 (SDA=IO38, SCL=IO40)
# ═══════════════════════════════════════════════════════════════
i2c:
  sda: GPIO38
  scl: GPIO40
  scan: false
  id: bus_a
  frequency: 400kHz

# MCP23017 I/O 扩展芯片 (地址 0x27)
#   继电器 1~4 : GPA0/GPA1/GPA2/GPA3 (CD/DAC/PC/AUX)
#   硬件静音    : GPA6
#   音频检测     : GPB0/GPB1/GPB2/GPB3 (CD/DAC/PC/AUX)
mcp23017:
  - id: mcp23017_hub
    address: 0x27
    interrupt_pin: GPIO12       # INTB 中断信号 (Port B 音频检测输入)
    open_drain_interrupt: true  # 开漏 + 低电平有效, ESP32-S3 内部上拉, 防电平冲突

