text_sensor:
  - platform: wifi_info
    ip_address:
      name: "设备IP"
      id: device_ip

  - platform: template
    name: "BLE HID 按键事件"
    id: ble_hid_event_text
    update_interval: never
    on_value:
      then:
        - homeassistant.event:
            event: esphome.hid_events
            data:
              usage: !lambda 'return x;'

number:
  - platform: template
    name: "主音量 Volume"
    id: volume_number
    icon: mdi:volume-high
    min_value: 0
    max_value: 100
    unit_of_measurement: "%"
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          if (!id(system_ready) || id(switching_input)) return;
          int v = (int)roundf(x * id(max_volume) / 100.0f);
          if (v < 0) v = 0;
          if (v > id(max_volume)) v = id(max_volume);
          id(volume_val) = v;
          id(last_v_change_ms) = millis();
          id(schedule_current_input_volume_save)->execute(id(current_input), id(volume_val));
          id(send_volume_to_pga)->execute();
          id(sync_settings_ui)->execute();
          id(reset_idle_timer)->execute();

  - platform: template
    name: "声道平衡 Balance"
    id: balance_number
    icon: mdi:scale-balance
    min_value: -20
    max_value: 20
    step: 1
    mode: slider
    set_action:
      - lambda: |-
          if (!id(system_ready) || id(switching_input)) return;
          id(balance) = (int)x;
          id(save_current_input_balance)->execute(id(current_input), id(balance));
          // 音量稳态时，直接同步 L/R 声道到 PGA
          if (fabs(id(target_db) - id(current_db)) <= 0.09f) {
            float db = id(current_db);
            int base_reg;
            if (db <= -95.5f) {
              base_reg = 0;
            } else {
              base_reg = (int)roundf(192.0f + db * 2.0f);
              if (base_reg < 0) base_reg = 0;
              if (base_reg > 255) base_reg = 255;
            }

                int bal = id(balance);
                if (bal < -20) bal = -20;
                if (bal > 20)  bal = 20;

                // balance > 0 = 偏右：只衰减左声道
                // balance < 0 = 偏左：只衰减右声道
                int l_reg = base_reg;
                int r_reg = base_reg;

                if (bal > 0) {
                 l_reg -= bal;
                } else if (bal < 0) {
                 r_reg += bal;   // bal 为负数，所以这里等价于 r_reg - abs(bal)
                }

                // 完整限幅，防止未来算法调整后越界
                if (l_reg < 0)   l_reg = 0;
                if (l_reg > 255) l_reg = 255;
                if (r_reg < 0)   r_reg = 0;
                if (r_reg > 255) r_reg = 255;

                pga2311::set_volume(r_reg, l_reg);
          }
          id(send_volume_to_pga)->execute();
          id(sync_settings_ui)->execute();
          id(reset_idle_timer)->execute();
  - platform: template
    name: "最大音量上限 Max"
    id: max_volume_number
    icon: mdi:volume-high
    min_value: 10
    max_value: 255
    step: 1
    mode: slider
    initial_value: 255
    set_action:
      - lambda: |-
          if (!id(system_ready) || id(switching_input)) return;
          float old_max = id(max_volume) > 0 ? (float)id(max_volume) : 1.0f;
          float current_pct = (float)id(volume_val) / old_max;
          id(max_volume) = (int)x;
          if (id(power_on_limit) > id(max_volume)) {
            id(power_on_limit) = id(max_volume);
            id(power_on_limit_number)->publish_state((float)id(power_on_limit));
          }
          int new_vol = (int)(current_pct * id(max_volume));
          if (new_vol > id(max_volume)) new_vol = id(max_volume);
          id(volume_val) = new_vol;
          id(max_volume_number)->publish_state((float)id(max_volume));
          float pct = (float)id(volume_val) / (float)id(max_volume);
          if (pct > 1.0f) pct = 1.0f;
          id(volume_number)->publish_state(pct * 100.0f);
          id(schedule_current_input_volume_save)->execute(id(current_input), id(volume_val));
          id(send_volume_to_pga)->execute();
          id(sync_settings_ui)->execute();
          id(reset_idle_timer)->execute();

