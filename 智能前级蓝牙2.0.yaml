# ═══════════════════════════════════════════════════════════════
# 颜色定义 — SquareLine 绿色主题
# ═══════════════════════════════════════════════════════════════
color:
  # ═══ SquareLine 绿色体系 ═══
  - id: color_black
    hex: "111827"          # 深灰蓝 — 主背景 (SquareLine bg)
  - id: color_white
    hex: "F1F5F9"          # 亮白 — 主文字
  - id: color_red
    hex: "FF0000"          # LED红
  - id: color_green
    hex: "10B981"          # 翠绿 — 主强调色 (SquareLine accent)
  - id: color_gray
    hex: "8E9FB8"          # 灰蓝 — 次要文字
  - id: color_dark
    hex: "1A1A2E"          # 深色面板背景
  - id: color_accent
    hex: "10B981"          # 翠绿 — 强调色 (与 color_green 一致)
  - id: color_muted
    hex: "FF3300"          # 静音指示红
  - id: color_bg_light
    hex: "E9E8E8"          # 浅灰 — 进度条背景
  # ── 频谱渐变色 (低音深绿 → 中音亮绿 → 高音黄/红) ──
  - id: color_spec_0
    hex: "064E3B"          # 63Hz   — 深翠绿
  - id: color_spec_1
    hex: "065F46"          # 160Hz  — 暗绿
  - id: color_spec_2
    hex: "047857"          # 400Hz  — 中绿
  - id: color_spec_3
    hex: "059669"          # 1kHz   — 翠绿
  - id: color_spec_4
    hex: "10B981"          # 2.5kHz — 亮绿 (主色)
  - id: color_spec_5
    hex: "34D399"          # 6.25kHz — 青绿
  - id: color_spec_6
    hex: "6EE7B7"          # 16kHz  — 浅绿
  - id: color_peak
    hex: "FFFFFF"          # 峰值保持线 — 白色
  - id: color_track
    hex: "1A1A2E"          # 频谱背景轨道色

# ═══════════════════════════════════════════════════════════════
# 输出
# ═══════════════════════════════════════════════════════════════
output:
  # LED 指示灯 PWM (IO16, 支持呼吸/闪烁/渐变)
  - platform: ledc
    id: led_indicator
    pin: GPIO16
    frequency: 1000Hz

  # TFT 背光 PWM (LEDC, IO7)
  - platform: ledc
    id: backlight_pwm
    pin: GPIO7
    frequency: 5000Hz

# ═══════════════════════════════════════════════════════════════
# 灯光 — TFT 背光
# ═══════════════════════════════════════════════════════════════
light:
  - platform: monochromatic
    output: backlight_pwm
    name: "显示屏背光"
    id: display_backlight
    restore_mode: ALWAYS_ON

  # LED 指示灯 (IO16) — 由 interval lambda 直接 PWM 控制 (待机呼吸/WiFi闪烁/静音半亮等)
  # 无 light entity — 避免与 lambda 争抢输出控制

# ═══════════════════════════════════════════════════════════════
# 开关
# ═══════════════════════════════════════════════════════════════
switch:
  # 硬件静音 — MCP23017 GPA6
  # 重点: 硬件高电平=开声, 低电平=静音。
  # 这里使用 inverted，让 HA 的“静音-HW”开关 ON=输出低电平=静音，OFF=输出高电平=开声。
  - platform: gpio
    id: mute_switch
    name: "静音-HW"
    icon: mdi:volume-mute
    pin:
      mcp23xxx: mcp23017_hub
      number: 6
      inverted: true
      mode:
        output: true
    restore_mode: ALWAYS_ON

  - platform: template
    name: "静音-SW"
    id: soft_mute_switch
    icon: mdi:volume-off
    restore_mode: RESTORE_DEFAULT_OFF
    optimistic: true
    turn_on_action:
      - globals.set: {id: soft_mute, value: 'true'}
      - script.execute: send_volume_to_pga
      - lambda: 'pga2311::set_volume(0, 0);'
      - switch.turn_on: mute_switch
      - script.execute: reset_idle_timer
    turn_off_action:
      - if:
          condition:
            lambda: 'return id(standby) || id(temp_protect) || id(ota_active) || id(power_transitioning);'
          then:
            - lambda: |-
                id(soft_mute) = true;
                id(soft_mute_switch)->publish_state(true);
                id(mute_switch)->turn_on();
                pga2311::set_volume(0, 0);
          else:
            - globals.set: {id: soft_mute, value: 'false'}
            - switch.turn_off: mute_switch
            - script.execute: send_volume_to_pga
      - script.execute: reset_idle_timer

  - platform: template
    name: "待机模式"
    id: standby_switch
    icon: mdi:power
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    # ⚠️ 重要: HA switch ON = 设备运行(非待机), OFF = 待机模式
    # turn_off = HA关闭开关 → 进入待机, turn_on = HA打开开关 → 退出待机
    turn_off_action:
      - script.execute: enter_standby
    turn_on_action:
      - if:
          condition:
            lambda: 'return id(standby) && !id(temp_protect);'
          then:
            - script.execute: exit_standby
          else:
            - lambda: |-
                if (id(temp_protect)) id(standby_switch)->publish_state(false);

  # ── 输入继电器 (MCP23017 GPA0~GPA3, CD/DAC/PC/AUX) ──
  - platform: gpio
    id: relay_in1
    name: "继电器-输入1"
    pin:
      mcp23xxx: mcp23017_hub
      number: 0
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true

  - platform: gpio
    id: relay_in2
    name: "继电器-输入2"
    pin:
      mcp23xxx: mcp23017_hub
      number: 1
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true

  - platform: gpio
    id: relay_in3
    name: "继电器-输入3"
    pin:
      mcp23xxx: mcp23017_hub
      number: 2
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true

  - platform: gpio
    id: relay_in4
    name: "继电器-输入4"
    pin:
      mcp23xxx: mcp23017_hub
      number: 3
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true

  # ── 输出继电器 (MCP23017 GPA4, 低=变压器输出/常闭, 高=直通输出) ──
  - platform: gpio
    id: relay_out
    name: "继电器-输出"
    pin:
      mcp23xxx: mcp23017_hub
      number: 4
      mode:
        output: true
    restore_mode: RESTORE_DEFAULT_OFF
    internal: true

  # ── 自动输入切换开关 (HA 控制 + LVGL 同步) ──
  - platform: template
    name: "自动输入切换"
    id: auto_input_switch
    icon: mdi:swap-horizontal
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    turn_on_action:
      - globals.set: {id: auto_input, value: 'true'}
      - script.execute: sync_settings_ui
      - script.execute: reset_idle_timer
    turn_off_action:
      - globals.set: {id: auto_input, value: 'false'}
      - script.execute: sync_settings_ui
      - script.execute: reset_idle_timer

# ═══════════════════════════════════════════════════════════════
# NV3007 2.79" TFT 显示 — ESPHome 官方 mipi_spi 驱动 (CUSTOM 模式)
# ═══════════════════════════════════════════════════════════════
display:
  - platform: mipi_spi
    model: CUSTOM
    spi_id: display_spi
    
    dc_pin: GPIO6
    reset_pin: GPIO15
    dimensions:
      width: 142
      height: 428
      offset_width: 12
      offset_height: 0
    color_order: RGB
    color_depth: 16
    pixel_mode: 16bit
    invert_colors: false
    # Real chassis wiring has less margin than bench wiring; 40MHz keeps the NV3007 SPI link stable.
    data_rate: 80MHz
    auto_clear_enabled: false
    update_interval: never
    id: tft_display
    init_sequence:
      # ── NV3007 解锁 ──
      - [0xFF, 0xA5]
      # ── 电源/时序配置 ──
      - [0x9A, 0x08]
      - [0x9B, 0x08]
      - [0x9C, 0xB0]
      - [0x9D, 0x16]
      - [0x9E, 0xC4]
      - [0x8F, 0x55, 0x04]
      - [0x84, 0x90]
      - [0x83, 0x7B]
      - [0x85, 0x33]
      # ── VBP/VFP ──
      - [0x60, 0x00]
      - [0x70, 0x00]
      - [0x61, 0x02]
      - [0x71, 0x02]
      - [0x62, 0x04]
      - [0x72, 0x04]
      # ── Gate EQ ──
      - [0x6C, 0x29]
      - [0x7C, 0x29]
      - [0x6D, 0x31]
      - [0x7D, 0x31]
      - [0x6E, 0x0F]
      - [0x7E, 0x0F]
      - [0x66, 0x21]
      - [0x76, 0x21]
      - [0x68, 0x3A]
      - [0x78, 0x3A]
      - [0x63, 0x07]
      - [0x73, 0x07]
      - [0x64, 0x05]
      - [0x74, 0x05]
      - [0x65, 0x02]
      - [0x75, 0x02]
      - [0x67, 0x23]
      - [0x77, 0x23]
      - [0x69, 0x08]
      - [0x79, 0x08]
      - [0x6A, 0x13]
      - [0x7A, 0x13]
      - [0x6B, 0x13]
      - [0x7B, 0x13]
      - [0x6F, 0x00]
      - [0x7F, 0x00]
      # ── Source OP ──
      - [0x50, 0x00]
      - [0x52, 0xD6]
      - [0x53, 0x08]
      - [0x54, 0x08]
      - [0x55, 0x1E]
      - [0x56, 0x1C]
      # ── GOA map ──
      - [0xA0, 0x2B, 0x24, 0x00]
      - [0xA1, 0x87]
      - [0xA2, 0x86]
      - [0xA5, 0x00]
      - [0xA6, 0x00]
      - [0xA7, 0x00]
      - [0xA8, 0x36]
      - [0xA9, 0x7E]
      - [0xAA, 0x7E]
      # ── GOA timing ──
      - [0xB9, 0x85]
      - [0xBA, 0x84]
      - [0xBB, 0x83]
      - [0xBC, 0x82]
      - [0xBD, 0x81]
      - [0xBE, 0x80]
      - [0xBF, 0x01]
      - [0xC0, 0x02]
      - [0xC1, 0x00]
      - [0xC2, 0x00]
      - [0xC3, 0x00]
      - [0xC4, 0x33]
      - [0xC5, 0x7E]
      - [0xC6, 0x7E]
      - [0xC8, 0x33, 0x33]
      - [0xC9, 0x68]
      - [0xCA, 0x69]
      - [0xCB, 0x6A]
      - [0xCC, 0x6B]
      - [0xCD, 0x33, 0x33]
      - [0xCE, 0x6C]
      - [0xCF, 0x6D]
      - [0xD0, 0x6E]
      - [0xD1, 0x6F]
      # ── Source Gamma ──
      - [0xAB, 0x03, 0x67]
      - [0xAC, 0x03, 0x6B]
      - [0xAD, 0x03, 0x68]
      - [0xAE, 0x03, 0x6C]
      - [0xB3, 0x00]
      - [0xB4, 0x00]
      - [0xB5, 0x00]
      - [0xB6, 0x32]
      - [0xB7, 0x7E]
      - [0xB8, 0x7E]
      # ── VCOM/Gamma ──
      - [0xE0, 0x00]
      - [0xE1, 0x03, 0x0F]
      - [0xE2, 0x04]
      - [0xE3, 0x01, 0x0E]
      - [0xE4, 0x01, 0x19]
      - [0xE5, 0x01]
      - [0xE6, 0x19]
