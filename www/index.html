<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#121624">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PGA2311">
    <title>PGA2311 前级控制台</title>
    <style>
        :root {
            --bg-color: #121624;
            --card-bg: #1e2336;
            --primary: #00e676;
            --text-main: #ffffff;
            --text-sub: #7a829e;
            --btn-bg: #2a2f45;
            --border-radius: 16px;
        }
        body {
            background-color: var(--bg-color); color: var(--text-main);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0; padding: 20px;
            display: flex; justify-content: center;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }
        .container { width: 100%; max-width: 400px; position: relative; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; position: relative; z-index: 1000; }
        .status-dot {
            height: 10px; width: 10px; background-color: red; border-radius: 50%;
            display: inline-block; margin-right: 8px; transition: 0.3s;
        }
        .status-dot.online { background-color: var(--primary); box-shadow: 0 0 8px var(--primary); }
        .ip-input {
            background: var(--btn-bg); border: none; color: white;
            padding: 8px 12px; border-radius: 20px; font-size: 12px; outline: none; text-align: center; width: 110px;
        }
        .web-version {
            margin-left: 8px;
            color: var(--text-sub);
            font-size: 10px;
            font-weight: 600;
        }
        .card {
            background-color: var(--card-bg); border-radius: var(--border-radius);
            padding: 20px; margin-bottom: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card-title { color: var(--text-sub); font-size: 12px; font-weight: bold; letter-spacing: 1px; margin-bottom: 15px; }
        .vol-display { text-align: center; margin-bottom: 20px; }
        .vol-number { font-size: 48px; font-weight: 800; color: var(--primary); line-height: 1; font-variant-numeric: tabular-nums; }
        .vol-unit { font-size: 18px; font-weight: 600; color: var(--text-sub); margin-left: 2px; }
        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; margin: 15px 0; }
        input[type=range]:focus { outline: none; }
        input[type=range]::-webkit-slider-thumb {
            height: 22px; width: 22px; border-radius: 50%; background: #ffffff;
            cursor: pointer; -webkit-appearance: none; margin-top: -7px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%; height: 8px; border-radius: 4px; background: var(--btn-bg);
        }
        #vol-slider { --track-fill: 0%; }
        #vol-slider::-webkit-slider-runnable-track {
            background: linear-gradient(90deg, var(--primary) var(--track-fill), var(--btn-bg) var(--track-fill));
        }
        .slider-balance::-webkit-slider-runnable-track {
            background: linear-gradient(90deg, #00e676, #00b0ff) !important;
        }
        .slider-labels { display: flex; justify-content: space-between; color: var(--text-sub); font-size: 12px; }
        .input-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .input-btn {
            background-color: var(--btn-bg); border-radius: 12px; padding: 15px 0;
            text-align: center; color: var(--text-sub); font-size: 14px; cursor: pointer; transition: 0.2s; border: 1px solid transparent;
        }
        .input-btn.active { border-color: var(--primary); color: var(--primary); background-color: rgba(0, 230, 118, 0.1); }
        .control-row { display: flex; justify-content: space-around; align-items: center; margin-top: 10px; }
        .circle-btn {
            width: 60px; height: 60px; border-radius: 50%; background-color: var(--btn-bg);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            color: var(--text-sub); cursor: pointer; border: none; font-size: 12px; transition: 0.2s;
        }
        .circle-btn:active { transform: scale(0.9); }
        .circle-btn.active { color: #ff9800; border: 1px solid #ff9800; background-color: rgba(255, 152, 0, 0.1); }
        .circle-btn i { font-size: 20px; margin-bottom: 4px; font-style: normal; }
        .btn-mute.active { color: red; border-color: red; background-color: rgba(255,0,0,0.1); }
        .btn-standby.active { color: #ff9800; border-color: #ff9800; background-color: rgba(255,152,0,0.1); }

        /* ══ 媒体控制区 ══ */
        .media-section {
            margin-top: 20px;
            padding-top: 18px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }
        .media-label {
            text-align: center;
            color: var(--text-sub);
            font-size: 10px;
            letter-spacing: 2px;
            margin-bottom: 14px;
            font-weight: bold;
        }

        /* 媒体按钮行 */
        .media-row {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .media-btn {
            border-radius: 50%;
            background-color: var(--btn-bg);
            border: 1px solid transparent;
            color: var(--text-sub);
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            -webkit-tap-highlight-color: transparent;
            position: relative;
            overflow: hidden;
        }
        .media-btn:active { transform: scale(0.88); }

        /* 上一首 / 下一首 */
        .media-btn.btn-prev,
        .media-btn.btn-next {
            width: 48px; height: 48px;
            font-size: 18px;
        }
        .media-btn.btn-prev:active,
        .media-btn.btn-next:active {
            background-color: rgba(0,230,118,0.15);
            border-color: var(--primary);
            color: var(--primary);
        }

        /* 播放按钮 */
        .media-btn.btn-play {
            width: 64px; height: 64px;
            font-size: 26px;
            font-weight: bold;
            border: none;
            background-color: var(--btn-bg);
            color: var(--text-sub);
            transition: all 0.3s ease;
        }
        .media-btn.btn-play.playing {
            background: linear-gradient(135deg, #00e676, #00c853);
            color: #121624;
            box-shadow: 0 4px 24px rgba(0, 230, 118, 0.35),
                        inset 0 1px 0 rgba(255,255,255,0.2);
        }
        .media-btn.btn-play:active {
            transform: scale(0.9);
        }
        /* 暂停按钮 */
        .media-btn.btn-pause {
            width: 56px; height: 56px;
            font-size: 22px;
            background-color: var(--btn-bg);
            color: var(--text-sub);
            border: 1px solid transparent;
        }
        .media-btn.btn-pause:active {
            background-color: rgba(255,152,0,0.15);
            border-color: #ff9800;
            color: #ff9800;
        }

        /* 电源行 */
        .power-row {
            display: flex;
            justify-content: center;
            gap: 24px;
            margin-top: 16px;
        }
        .power-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid;
            cursor: pointer;
            font-size: 12px;
            font-weight: 600;
            transition: all 0.2s;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
        }
        .power-btn:active { transform: scale(0.92); }
        .power-btn.btn-off {
            border-color: rgba(255,82,82,0.4);
            color: #ff5252;
        }
        .power-btn.btn-off:active {
            background: rgba(255,82,82,0.15);
        }
        .power-btn.btn-on {
            border-color: rgba(0,230,118,0.4);
            color: #00e676;
        }
        .power-btn.btn-on:active {
            background: rgba(0,230,118,0.15);
        }
        .power-btn .power-icon { font-size: 14px; }

        /* Firefox 滑块兼容 */
        input[type=range]::-moz-range-thumb {
            height: 22px; width: 22px; border-radius: 50%; background: #ffffff;
            cursor: pointer; border: none; box-shadow: 0 0 10px rgba(0,0,0,0.5);
        }
        input[type=range]::-moz-range-track {
            width: 100%; height: 8px; border-radius: 4px; background: var(--btn-bg);
        }
        #vol-slider::-moz-range-track {
            background: linear-gradient(90deg, var(--primary) var(--track-fill), var(--btn-bg) var(--track-fill));
        }
        .slider-balance::-moz-range-track {
            background: linear-gradient(90deg, #00e676, #00b0ff) !important;
        }

        /* Toast 提示 */
        .toast {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            background: rgba(255,80,80,0.95); color: white; padding: 10px 24px;
            border-radius: 24px; font-size: 13px; z-index: 9999;
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .toast.show { opacity: 1; }

        /* ══ 连接锁定遮罩（未连接时覆盖所有操作区）══ */
        .lock-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(18, 22, 36, 0.88);
            backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
            z-index: 999;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: opacity 0.35s ease, visibility 0.35s ease;
        }
        .lock-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }
        .lock-overlay.visible {
            opacity: 1; visibility: visible; pointer-events: auto;
        }
        .lock-icon {
            width: 72px; height: 72px;
            border-radius: 50%;
            border: 3px solid rgba(255,80,80,0.4);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 20px;
            animation: lockPulse 2s ease-in-out infinite;
        }
        @keyframes lockPulse {
            0%, 100% { box-shadow: 0 0 0 0 rgba(255,80,80,0.15); }
            50% { box-shadow: 0 0 0 12px rgba(255,80,80,0); }
        }
        .lock-icon svg { width: 32px; height: 32px; fill: #ff5050; }
        .lock-title {
            font-size: 22px; font-weight: 700; color: #fff;
            letter-spacing: 4px; margin-bottom: 6px;
        }
        .lock-status {
            font-size: 14px; color: var(--text-sub);
        }

        /* 连接异常只做视觉提示, 不再阻止本地控制命令 */
        .controls-locked {
            opacity: 0.72 !important;
        }

        /* ══ 开关机二次确认弹窗 ══ */
        .confirm-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.65); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
            z-index: 10000; display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: all 0.25s ease;
        }
        .confirm-overlay.show { opacity: 1; visibility: visible; }
        .confirm-box {
            background: var(--card-bg); border-radius: 20px; padding: 28px 24px 22px;
            text-align: center; min-width: 280px; box-shadow: 0 8px 40px rgba(0,0,0,0.5);
            transform: scale(0.85); transition: transform 0.25s ease;
        }
        .confirm-overlay.show .confirm-box { transform: scale(1); }
        .confirm-icon {
            width: 56px; height: 56px; border-radius: 50%; margin: 0 auto 14px;
            display: flex; align-items: center; justify-content: center; font-size: 28px;
        }
        .confirm-icon.icon-power-on {
            background: rgba(0,230,118,0.15); border: 2px solid #00e676; color: #00e676;
        }
        .confirm-icon.icon-power-off {
            background: rgba(255,82,82,0.15); border: 2px solid #ff5252; color: #ff5252;
        }
        .confirm-title { font-size: 18px; font-weight: 700; margin-bottom: 6px; }
        .confirm-sub { font-size: 13px; color: var(--text-sub); margin-bottom: 20px; }
        .confirm-btns { display: flex; gap: 12px; justify-content: center; }
        .confirm-btns button {
            padding: 10px 28px; border-radius: 12px; border: none; font-size: 14px;
            font-weight: 600; cursor: pointer; transition: 0.2s;
        }
        .confirm-btns .btn-cancel {
            background: var(--btn-bg); color: var(--text-sub);
        }
        .confirm-btns .btn-cancel:hover { background: #363b52; }
        .confirm-btns .btn-confirm-on {
            background: linear-gradient(135deg,#00e676,#00c853); color: #121624;
        }
        .confirm-btns .btn-confirm-off {
            background: linear-gradient(135deg,#ff5252,#d32f2f); color: #fff;
        }
        .confirm-countdown { font-size: 13px; color: var(--text-sub); margin-top: 10px; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div style="display: flex; align-items: center; font-size: 14px;">
            <span class="status-dot" id="conn-dot"></span>
            <span id="conn-text" style="transition: 0.3s;">未连接</span>
            <span class="web-version">WEB v2.1.33</span>
        </div>
        <input type="text" id="ip-address" class="ip-input" placeholder="输入设备 IP">
    </div>

    <div class="card">
        <div class="card-title" style="text-align: center;">VOLUME</div>
        <div class="vol-display">
            <span class="vol-number" id="vol-text">--</span><span class="vol-unit" id="vol-unit">dB</span>
        </div>
        <input type="range" id="vol-slider" min="0" max="100" value="0">
        <div class="slider-labels"><span>0</span><span>100</span></div>
    </div>

    <div class="card">
        <div class="card-title">INPUT SOURCE</div>
        <div class="input-grid">
            <div class="input-btn" onclick="sendCmd('input', 'set?option=CD')" id="btn-cd">CD</div>
            <div class="input-btn" onclick="sendCmd('input', 'set?option=DAC')" id="btn-dac">DAC</div>
            <div class="input-btn" onclick="sendCmd('input', 'set?option=PC')" id="btn-pc">PC</div>
            <div class="input-btn" onclick="sendCmd('input', 'set?option=AUX')" id="btn-aux">AUX</div>
        </div>
    </div>

    <div class="card">
        <div class="control-row">
            <button class="circle-btn btn-standby" id="btn-standby" onclick="sendStandbyToggle();">
                <i>⏻</i><span id="standby-label">运行</span>
            </button>
            <button class="circle-btn btn-mute" id="btn-mute" onclick="sendCmd('mute', 'toggle');">
                <i>🔇</i>静音
            </button>
            <button class="circle-btn" onclick="stepVol(-2)"><i>-</i>减小</button>
            <button class="circle-btn" onclick="stepVol(2)"><i>+</i>增大</button>
        </div>

        <!-- 媒体控制 -->
        <div class="media-section">
            <div class="media-label">MEDIA CONTROL</div>
            <div class="media-row">
                <button class="media-btn btn-prev" onclick="sendMedia('上一首')" title="上一首">⏮</button>
                <button class="media-btn btn-play" id="btn-play" onclick="sendMedia('播放')" title="播放">▶</button>
                <button class="media-btn btn-pause" onclick="sendMedia('暂停')" title="暂停">⏸</button>
                <button class="media-btn btn-next" onclick="sendMedia('下一首')" title="下一首">⏭</button>
            </div>
            <div class="power-row">
                <button class="power-btn btn-off" onclick="showPowerConfirm('off')">
                    <span class="power-icon">⏻</span>关机
                </button>
                <button class="power-btn btn-on" onclick="showPowerConfirm('on')">
                    <span class="power-icon">⏼</span>开机
                </button>
            </div>
        </div>
    </div>

    <div class="card">
        <div class="card-title">声道平衡 BALANCE</div>
        <input type="range" class="slider-balance" id="bal-slider" min="-20" max="20" value="0">
        <div class="slider-labels">
            <span>L 20</span>
            <span id="bal-text" style="color:white; transition: 0.1s;">居中 0</span>
            <span>R 20</span>
        </div>
    </div>
</div>

<!-- 连接锁定遮罩 -->
<div class="lock-overlay visible" id="lock-overlay">
    <div class="lock-icon">
        <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-9-2c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm9 14H6V10h12v10zm-6-3c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2z"/></svg>
    </div>
    <div class="lock-title">前级</div>
    <div class="lock-status" id="lock-status-text">未连接</div>
</div>

<div class="toast" id="toast"></div>

<!-- 开关机二次确认弹窗 -->
<div class="confirm-overlay" id="power-confirm">
    <div class="confirm-box">
        <div class="confirm-icon" id="confirm-icon">⏻</div>
        <div class="confirm-title" id="confirm-title">确认操作</div>
        <div class="confirm-sub" id="confirm-sub">确定要执行此操作吗？</div>
        <div class="confirm-btns">
            <button class="btn-cancel" onclick="hidePowerConfirm()">取消</button>
            <button class="" id="confirm-ok-btn" onclick="confirmPowerAction()">确认</button>
        </div>
        <div class="confirm-countdown" id="confirm-countdown"></div>
    </div>
</div>

<script>
    const DEFAULT_DEVICE_IP = '192.168.31.99';
    const ENTITY_FALLBACKS = {
        vol: { domain: 'number', name: '主音量 Volume', id: '' },
        bal: { domain: 'number', name: '声道平衡 Balance', id: '' },
        input: { domain: 'select', name: '输入源选择 Input', id: '' },
        mute: { domain: 'switch', name: '静音-SW', id: '' },
        media: { domain: 'select', name: '媒体控制 Media', id: '' },
        mediaPlay: { domain: 'button', name: '媒体播放 Play', id: '' },
        mediaPause: { domain: 'button', name: '媒体暂停 Pause', id: '' },
        mediaNext: { domain: 'button', name: '媒体下一首 Next', id: '' },
        mediaPrev: { domain: 'button', name: '媒体上一首 Prev', id: '' },
        standby: { domain: 'switch', name: '待机模式', id: '' }
    };
    const MEDIA_BUTTON_KEYS = {
        '播放': 'mediaPlay',
        '暂停': 'mediaPause',
        '下一首': 'mediaNext',
        '上一首': 'mediaPrev'
    };
    const savedDeviceIp = localStorage.getItem('pga2311_ip');
    let deviceIp = (!savedDeviceIp || savedDeviceIp === '192.168.31.86') ? DEFAULT_DEVICE_IP : savedDeviceIp;
    if (deviceIp !== savedDeviceIp) localStorage.setItem('pga2311_ip', deviceIp);
    document.getElementById('ip-address').value = deviceIp;
    let currentVol = 0;
    let eventSource = null;

    let eMap = { ...ENTITY_FALLBACKS };
    let standbyMode = false;

    // ════════════════════════════════════════
    // ★ V2 连接引擎：军工级稳定性增强
    // ════════════════════════════════════════

    // ---- 状态机 ----
    let connState = 'idle';          // idle | connecting | connected | waiting | unstable | disabled
    let reconnectDelay = 1000;       // 指数退避起始 1s
    const RECONNECT_MAX = 30000;     // 最大退避 30s
    const HEARTBEAT_MS = 30000;      // 心跳超时 30s（空闲时ESPHome不推数据，需宽裕）
    const GRACE_PERIOD_MS = 2000;   // 断连宽限期 2s（宽限期内不锁屏、不弹toast）
    let lastDataTime = 0;            // 最后收到数据的时间戳
    let disconnectTime = 0;          // 断连发生的时间戳
    let heartbeatTimer = null;
    let reconnectTimer = null;
    let connTimer = null;
    let forcedClose = false;         // 标记是否主动关闭（区分主动关闭和异常断开）
    let manualReconnectRequested = false; // 用户手动触发的重连

    // ---- Toast 提示 ----
    let toastTimer = null;
    function showToast(msg, duration = 2500) {
        const t = document.getElementById('toast');
        t.innerText = msg;
        t.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => t.classList.remove('show'), duration);
    }

    // ---- IP 校验 ----
    function isValidIP(ip) {
        const parts = ip.trim().split('.');
        if (parts.length !== 4) return false;
        return parts.every(p => {
            const n = parseInt(p, 10);
            return !isNaN(n) && n >= 0 && n <= 255 && String(n) === p;
        });
    }

    // ---- 音量百分比(0~100) → dB（与实机 PGA2311 公式一致）----
    function pctToDb(pct) {
        // pct: 0~100，基于 max_volume 的百分比
        const p = Math.max(0, Math.min(1, pct / 100));
        const reg_f = p * 255.0;
        if (reg_f < 1.0) return -96.0;
        return (reg_f - 192.0) * 0.5;
    }
    function formatDb(db) {
        if (db <= -95.5) return '-∞';
        return db.toFixed(1);
    }

    // ---- UI 状态显示（增强版：含重连倒计时） ----
    const overlay = document.getElementById('lock-overlay');
    const lockText  = document.getElementById('lock-status-text');
    const controlCards = document.querySelectorAll('.card');

    function setControlsEnabled(enabled) {
        overlay.classList.remove('visible');
        overlay.classList.add('hidden');
        controlCards.forEach(c => c.classList.toggle('controls-locked', !enabled));
    }

    function updateConnStatus() {
        const dot = document.getElementById('conn-dot');
        const text = document.getElementById('conn-text');
        if (!eventSource || connState === 'disabled') {
            dot.className = 'status-dot';
            text.innerText = connState === 'disabled' ? '已停止' : '未连接';
            text.style.color = 'white';
            lockText.innerText = connState === 'disabled' ? '已停止' : '未连接';
            setControlsEnabled(false);
            return;
        }
        const state = eventSource.readyState;
        if (state === EventSource.OPEN && connState === 'connected') {
            dot.className = 'status-dot online';
            const idleSec = Math.floor((Date.now() - lastDataTime) / 1000);
            text.innerText = idleSec > 15 ? `已连接 (${idleSec}s)` : '已连接';
            text.style.color = '#00e676';
            setControlsEnabled(true);
        } else if (state === EventSource.OPEN && connState === 'unstable') {
            // 宽限期内的短暂断连恢复，显示黄色但不锁屏
            dot.className = 'status-dot online';
            text.innerText = '已连接';
            text.style.color = '#00e676';
            connState = 'connected';
            setControlsEnabled(true);
        } else if (state === EventSource.CONNECTING) {
            dot.className = 'status-dot';
            text.innerText = manualReconnectRequested ? '重连中...' : `连接中...`;
            text.style.color = '#ffaa00';
            if (connState === 'unstable') {
                // 宽限期内重连，不锁屏
                lockText.innerText = '重连中...';
            } else {
                lockText.innerText = manualReconnectRequested ? '重连中...' : '连接中...';
                setControlsEnabled(false);
            }
        } else {
            // CLOSED 或其他
            if (connState === 'unstable') {
                // 宽限期内，不锁屏，只改颜色
                dot.className = 'status-dot';
                text.innerText = '重连中...';
                text.style.color = '#ffaa00';
                lockText.innerText = '重连中...';
            } else {
                dot.className = 'status-dot';
                const sec = Math.ceil(reconnectDelay / 1000);
                text.innerText = connState === 'waiting' ? `${sec}s后重连` : '连接中断';
                text.style.color = 'red';
                lockText.innerText = connState === 'waiting' ? `${sec}s后重连` : '连接中断';
                setControlsEnabled(false);
            }
        }
    }

    // ---- 心跳检测：长时间无数据 → 宽限期后强制重连 ----
    function startHeartbeat() {
        stopHeartbeat();
        heartbeatTimer = setInterval(() => {
            if (connState !== 'connected' || !eventSource) return;
            const idle = Date.now() - lastDataTime;
            if (idle > HEARTBEAT_MS) {
                console.warn(`[心跳] ${Math.floor(idle/1000)}s 无数据，进入宽限期重连`);
                connState = 'unstable';
                disconnectTime = Date.now();
                forcedClose = true;
                closeSSE();
                scheduleReconnect();
            }
        }, 5000); // 每 5 秒检查一次
    }
    function stopHeartbeat() { clearInterval(heartbeatTimer); heartbeatTimer = null; }

    // ---- 指数退避重连调度 ----
    function scheduleReconnect() {
        if (connState === 'disabled') return;
        cancelReconnect();
        if (connState !== 'unstable') connState = 'waiting';
        updateConnStatus();

        // 宽限期内用更快的重连节奏
        const delay = connState === 'unstable' ? 1000 : reconnectDelay;

        reconnectTimer = setTimeout(() => {
            if (connState !== 'waiting' && connState !== 'unstable') return;
            manualReconnectRequested = false;
            doConnect();
        }, delay);

        // 指数退避：1s → 2s → 4s → 8s → 16s → 30s(封顶)
        reconnectDelay = Math.min(reconnectDelay * 2, RECONNECT_MAX);
    }
    function cancelReconnect() { clearTimeout(reconnectTimer); reconnectTimer = null; }
    function resetReconnectDelay() { reconnectDelay = 1000; }

    // ---- 关闭 SSE ----
    function closeSSE() {
        if (eventSource) {
            eventSource.onopen = null;
            eventSource.onerror = null;
            eventSource.close();
            eventSource = null;
        }
    }

    // ---- 核心连接函数 ----
    function connect(manual) {
        if (manual) {
            manualReconnectRequested = true;
            resetReconnectDelay(); // 手动重连立即尝试
        }
        doConnect();
    }

    function doConnect() {
        if (!deviceIp || deviceIp.trim() === '' || deviceIp.includes('x')) return;
        if (!isValidIP(deviceIp)) { showToast('IP 格式不正确！'); return; }

        closeSSE();
        cancelReconnect();
        forcedClose = false;
        connState = 'connecting';

        try {
            eventSource = new EventSource(`http://${deviceIp}/events`);
        } catch (err) {
            console.warn('[SSE] 创建失败:', err);
            connState = 'idle';
            scheduleReconnect();
            return;
        }

        eventSource.onopen = () => {
            if (forcedClose) return;
            const wasUnstable = connState === 'unstable';
            connState = 'connected';
            lastDataTime = Date.now();
            disconnectTime = 0; // 清除断连时间戳
            resetReconnectDelay();
            startHeartbeat();
            updateConnStatus();

            if (manualReconnectRequested) {
                showToast('重连成功！', 1500);
                manualReconnectRequested = false;
            }
            // 宽限期内恢复不弹 toast，静默恢复
        };

        eventSource.onerror = () => {
            if (forcedClose) return;

            const wasConnected = connState === 'connected';
            const wasUnstable = connState === 'unstable';
            const inGrace = wasConnected || wasUnstable;
            stopHeartbeat();

            // 浏览器内置的 SSE 自动重连会先触发 onerror，
            // 如果 readyState 是 CONNECTING 说明浏览器正在自动重试
            if (eventSource && eventSource.readyState === EventSource.CONNECTING) {
                if (inGrace) {
                    // 首次断连进入宽限期，不锁屏不弹 toast
                    connState = 'unstable';
                    disconnectTime = disconnectTime || Date.now();
                } else {
                    connState = 'connecting';
                }
                updateConnStatus();
                return;
            }

            // 彻底断了，检查宽限期
            closeSSE();

            if (inGrace) {
                const graceElapsed = Date.now() - (disconnectTime || Date.now());
                if (graceElapsed < GRACE_PERIOD_MS) {
                    // 还在宽限期内，静默重连，不锁屏不弹 toast
                    connState = 'unstable';
                } else {
                    // 宽限期用完，正式断连
                    connState = 'waiting';
                    console.warn('[SSE] 宽限期结束，正式断开重连...');
                    showToast('连接断开，自动重连中...', 2000);
                }
            } else {
                connState = 'waiting';
                showToast('连接断开，自动重连中...', 2000);
            }

            updateConnStatus();
            scheduleReconnect();
        };

        eventSource.addEventListener('state', (e) => {
            if (forcedClose || connState !== 'connected') return;
            lastDataTime = Date.now(); // 收到任何数据都刷新心跳

            try {
                const data = JSON.parse(e.data);
                mapEntity(data);

                updateUI(data);
            } catch (err) {
                console.warn('SSE 数据解析错误:', err);
            }
        });

        // 启动状态监控定时器
        startConnMonitor();
    }

    function startConnMonitor() {
        if (connTimer) clearInterval(connTimer);
        connTimer = setInterval(updateConnStatus, 2000);
    }

    // ════════════════════════════════════════
    // 事件监听：全方位保活
    // ════════════════════════════════════════

    // 1️⃣ 页面可见性变化（切后台/回前台/手机亮屏）
    document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
            // 切到后台：停止心跳检测（后台定时器会被浏览器节流）
            stopHeartbeat();
            // 记录隐藏时间，用于判断是否过了很久
            window._hiddenAt = Date.now();
        } else {
            // 回到前台
            const hiddenMs = Date.now() - (window._hiddenAt || 0);
            const hiddenSec = hiddenMs / 1000;

            console.log(`[可见性] 回到前台，离线 ${hiddenSec.toFixed(1)}s`);

            if (!eventSource) {
                // 完全没有连接对象，直接重连
                resetReconnectDelay();
                connect(true);
                return;
            }

            const state = eventSource.readyState;

            if (state === EventSource.CLOSED) {
                // 已关闭 → 直接重连
                resetReconnectDelay();
                connect(true);
            } else if (state === EventSource.CONNECTING) {
                // 卡在连接中 → 可能已经死了，强制重来
                if (hiddenSec > 5) { // 超过5秒的CONNECTING基本是死连接
                    forcedClose = true;
                    closeSSE();
                    resetReconnectDelay();
                    connect(true);
                }
            } else if (state === EventSource.OPEN) {
                // 表面看起来还活着，但可能 TCP 已死（僵尸连接）
                if (hiddenSec > 30) {
                    // 超过30秒的后台时间，不管心跳状态直接重建连接更可靠
                    const dataIdle = Date.now() - lastDataTime;
                    if (dataIdle > HEARTBEAT_MS) {
                        forcedClose = true;
                        closeSSE();
                        resetReconnectDelay();
                        connect(true);
                    } else {
                        lastDataTime = Date.now();
                        startHeartbeat();
                    }
                } else {
                    // 短暂离开，重启心跳就好
                    lastDataTime = Date.now();
                    startHeartbeat();
                }
            }
            updateConnStatus();
        }
    });

    // 2️⃣ 获取焦点（点击地址栏返回等）
    window.addEventListener('focus', () => {
        if (document.hidden) return;
        if (connState === 'connected' && eventSource) {
            const idle = Date.now() - lastDataTime;
            if (idle > HEARTBEAT_MS * 2) { // 翻倍宽限，避免频繁重建
                console.log('[focus] 长时间无数据，重建连接');
                forcedClose = true;
                closeSSE();
                resetReconnectDelay();
                connect(true);
            }
        }
    });

    // 3️⃣ 网络状态变化（WiFi 切换/断网恢复）
    window.addEventListener('online', () => {
        console.log('[网络] 恢复在线，立即重连');
        resetReconnectDelay();
        connect(true);
    });
    window.addEventListener('offline', () => {
        console.log('[网络] 断网');
        showToast('网络已断开', 2000);
    });

    // 4️⃣ iOS 特殊处理：pageshow 事件（从缓存恢复时也重连）
    window.addEventListener('pageshow', (e) => {
        if (e.persisted) {
            console.log('[pageshow] 从 bfcache 恢复，重建连接');
            resetReconnectDelay();
            connect(true);
        }
    });

    // IP 输入框变更
    document.getElementById('ip-address').addEventListener('change', function(e) {
        deviceIp = e.target.value.trim();
        if (deviceIp && !isValidIP(deviceIp)) { showToast('IP 格式不正确！'); return; }
        localStorage.setItem('pga2311_ip', deviceIp);
        resetReconnectDelay();
        connect(true);
    });

    function mapEntity(entity) {
        const eid = entity.id || '';
        const name = entity.name || '';
        const nameId = entity.name_id || '';
        const domain = entity.domain || (nameId.includes('/') ? nameId.split('/')[0] : '');
        const mergeEntity = (key) => {
            const prev = eMap[key] || ENTITY_FALLBACKS[key] || {};
            eMap[key] = {
                domain: domain || prev.domain || '',
                name: name || prev.name || '',
                id: eid || prev.id || ''
            };
        };

        if (name === '静音-SW' || eid === 'switch-______-sw' || (!!eMap.mute.id && eid === eMap.mute.id)) mergeEntity('mute');
        else if (name === '待机模式' || eid === 'switch-____________' || (!!eMap.standby.id && eid === eMap.standby.id)) mergeEntity('standby');
        else if (name === '主音量 Volume' || eid.includes('volume') || eid.includes('vol') || (!!eMap.vol.id && eid === eMap.vol.id)) mergeEntity('vol');
        else if (name === '声道平衡 Balance' || eid.includes('balance') || eid.includes('bal') || (!!eMap.bal.id && eid === eMap.bal.id)) mergeEntity('bal');
        else if (name === '输入源选择 Input' || eid.includes('input') || (!!eMap.input.id && eid === eMap.input.id)) mergeEntity('input');
        else if (name === '媒体控制 Media' || (!!eMap.media.id && eid === eMap.media.id) || (domain === 'select' && eid.includes('media'))) mergeEntity('media');
        else if (name === '媒体播放 Play' || (!!eMap.mediaPlay.id && eid === eMap.mediaPlay.id) || (domain === 'button' && eid.includes('play'))) mergeEntity('mediaPlay');
        else if (name === '媒体暂停 Pause' || (!!eMap.mediaPause.id && eid === eMap.mediaPause.id) || (domain === 'button' && eid.includes('pause'))) mergeEntity('mediaPause');
        else if (name === '媒体下一首 Next' || (!!eMap.mediaNext.id && eid === eMap.mediaNext.id) || (domain === 'button' && eid.includes('next'))) mergeEntity('mediaNext');
        else if (name === '媒体上一首 Prev' || (!!eMap.mediaPrev.id && eid === eMap.mediaPrev.id) || (domain === 'button' && eid.includes('prev'))) mergeEntity('mediaPrev');
    }

    function entityPath(entity) {
        if (!entity || !entity.domain || !entity.name) return '';
        return `${entity.domain}/${encodeURIComponent(entity.name)}`;
    }

    function entityMatches(entity, mapped) {
        if (!entity || !mapped) return false;
        return (!!mapped.id && entity.id === mapped.id) || entity.name === mapped.name;
    }

    function sendByHiddenForm(url) {
        const target = `esp-post-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        const iframe = document.createElement('iframe');
        iframe.name = target;
        iframe.style.display = 'none';
        iframe.setAttribute('aria-hidden', 'true');

        const form = document.createElement('form');
        form.method = 'POST';
        form.action = url;
        form.target = target;
        form.style.display = 'none';

        const input = document.createElement('input');
        input.type = 'hidden';
        input.name = 'x';
        input.value = '1';
        form.appendChild(input);

        document.body.appendChild(iframe);
        document.body.appendChild(form);
        form.submit();
        setTimeout(() => {
            form.remove();
            iframe.remove();
        }, 5000);
        return true;
    }

    function shouldUseFormPost() {
        return true;
    }

    function sendRequest(url, label, options = {}) {
        if (shouldUseFormPost()) {
            sendByHiddenForm(url);
            if (!options.silentSuccess) showToast(`${label}已发送`, 1200);
            return Promise.resolve(true);
        }

        // Fallback kept for future same-origin use. The local console normally
        // uses form POST because Chrome may silently drop fetch/no-cors PNA calls.
        const postBody = new Uint8Array([49]);
        return fetch(url, {
            method: 'POST',
            mode: 'cors',
            cache: 'no-store',
            body: postBody
        }).then(res => {
            if (!res.ok) throw new Error(`${label} HTTP ${res.status}`);
            return true;
        }).catch(err => {
            if (err && /^.+ HTTP \d+$/.test(err.message || '')) {
                console.warn(`${label}失败:`, err);
                if (!options.silentHttpError) showToast(`${label}失败，请检查实体路径`, 3000);
                return false;
            }
            console.warn(`${label} CORS失败，尝试 no-cors 发送:`, err);
            return fetch(url, {
                method: 'POST',
                mode: 'no-cors',
                cache: 'no-store',
                body: postBody
            }).then(() => {
                if (!options.silentSuccess) showToast(`${label}已发送`, 1200);
                return true;
            }).catch(err2 => {
                console.warn(`${label}失败:`, err2);
                sendByHiddenForm(url);
                if (!options.silentSuccess) showToast(`${label}已发送`, 1200);
                return true;
            });
        });
    }

    function sendCmd(key, action) {
        if (deviceIp.includes('x')) return showToast("请先输入正确的 IP！");
        const path = entityPath(eMap[key]);
        if (!path) return showToast(`未找到实体: ${key}`);
        return sendRequest(`http://${deviceIp}/${path}/${action}`, '指令发送');
    }

    async function sendMedia(option) {
        const buttonKey = MEDIA_BUTTON_KEYS[option];
        if (buttonKey && eMap[buttonKey] && eMap[buttonKey].id) {
            const path = entityPath(eMap[buttonKey]);
            if (path) {
                const ok = await sendRequest(`http://${deviceIp}/${path}/press`, '媒体指令', {
                    silentHttpError: true,
                    silentNetworkError: true,
                    silentSuccess: true
                });
                if (ok) return;
            }
        }
        return sendCmd('media', `set?option=${encodeURIComponent(option)}`);
    }

    function sendPowerOn() {
        sendCmd('standby', 'turn_off');
    }

    function sendPowerOff() {
        sendCmd('standby', 'turn_on');
    }

    function sendStandbyToggle() {
        if (standbyMode) sendPowerOn();
        else sendPowerOff();
    }


    document.getElementById('vol-slider').addEventListener('input', e => {
        const db = pctToDb(e.target.value);
        document.getElementById('vol-text').innerText = formatDb(db);
        e.target.style.setProperty('--track-fill', e.target.value + '%');
    });
    document.getElementById('bal-slider').addEventListener('input', e => {
        const bal = parseInt(e.target.value);
        document.getElementById('bal-text').innerText = bal < 0 ? `左 ${-bal}` : bal > 0 ? `右 ${bal}` : '居中 0';
    });

    document.getElementById('vol-slider').addEventListener('change', e => sendCmd('vol', `set?value=${e.target.value}`));
    document.getElementById('bal-slider').addEventListener('change', e => sendCmd('bal', `set?value=${e.target.value}`));

    function stepVol(step) {
        const slider = document.getElementById('vol-slider');
        const newVol = Math.min(100, Math.max(0, parseInt(slider.value) + step));
        slider.value = newVol;
        const db = pctToDb(newVol);
        document.getElementById('vol-text').innerText = formatDb(db);
        slider.style.setProperty('--track-fill', newVol + '%');
        sendCmd('vol', `set?value=${newVol}`);
    }

    function updateUI(entity) {
        const eid = entity.id || '';
        const state = entity.state;

        if (entityMatches(entity, eMap.mute)) {
            document.getElementById('btn-mute').classList.toggle('active', state === 'ON');
            return;
        }

        if (entityMatches(entity, eMap.standby)) {
            standbyMode = state === 'ON';
            document.getElementById('btn-standby').classList.toggle('active', standbyMode);
            document.getElementById('standby-label').innerText = standbyMode ? '待机' : '运行';
            return;
        }

        if (entityMatches(entity, eMap.vol)) {
            currentVol = parseInt(entity.value);
            const db = pctToDb(currentVol);
            document.getElementById('vol-text').innerText = formatDb(db);
            document.getElementById('vol-slider').value = currentVol;
            document.getElementById('vol-slider').style.setProperty('--track-fill', currentVol + '%');
        }
        else if (entityMatches(entity, eMap.bal)) {
            const bal = parseInt(entity.value);
            document.getElementById('bal-slider').value = bal;
            document.getElementById('bal-text').innerText = bal < 0 ? `左 ${-bal}` : bal > 0 ? `右 ${bal}` : '居中 0';
        }
        else if (entityMatches(entity, eMap.input)) {
            ['CD','DAC','PC','AUX'].forEach(src => {
                document.getElementById(`btn-${src.toLowerCase()}`)
                    .classList.toggle('active', entity.state === src);
            });
        }
        else if (entityMatches(entity, eMap.media)) {
            const playBtn = document.getElementById('btn-play');
            if (playBtn) {
                playBtn.classList.toggle('playing', entity.state === '播放');
            }
        }
    }

    // ════════════════════════════════════════
    // 开关机二次确认
    // ════════════════════════════════════════
    let pendingPowerAction = '';
    let confirmCountdownTimer = null;

    function showPowerConfirm(action) {
        pendingPowerAction = action;
        const overlay = document.getElementById('power-confirm');
        const iconEl   = document.getElementById('confirm-icon');
        const titleEl  = document.getElementById('confirm-title');
        const subEl    = document.getElementById('confirm-sub');
        const okBtn    = document.getElementById('confirm-ok-btn');
        const cdEl     = document.getElementById('confirm-countdown');

        if (action === 'on') {
            iconEl.className = 'confirm-icon icon-power-on'; iconEl.innerText = '⏼';
            titleEl.innerText = '确认开机';
            subEl.innerText = '确定要唤醒设备吗？';
            okBtn.className = 'btn-confirm-on'; okBtn.innerText = '确认开机';
        } else {
            iconEl.className = 'confirm-icon icon-power-off'; iconEl.innerText = '⏻';
            titleEl.innerText = '确认关机';
            subEl.innerText = '确定要进入待机吗？';
            okBtn.className = 'btn-confirm-off'; okBtn.innerText = '确认关机';
        }
        cdEl.innerText = '';

        overlay.classList.add('show');

        // 5秒倒计时自动取消
        let sec = 5;
        cdEl.innerText = `${sec} 秒后自动取消`;
        clearInterval(confirmCountdownTimer);
        confirmCountdownTimer = setInterval(() => {
            sec--;
            if (sec <= 0) { hidePowerConfirm(); return; }
            cdEl.innerText = `${sec} 秒后自动取消`;
        }, 1000);
    }

    function hidePowerConfirm() {
        document.getElementById('power-confirm').classList.remove('show');
        clearInterval(confirmCountdownTimer);
        pendingPowerAction = '';
    }

    function confirmPowerAction() {
        if (pendingPowerAction === 'on') {
            sendPowerOn();
        } else if (pendingPowerAction === 'off') {
            sendPowerOff();
        }
        hidePowerConfirm();
    }

    // 点击遮罩背景也可关闭
    document.getElementById('power-confirm').addEventListener('click', e => {
        if (e.target.id === 'power-confirm') hidePowerConfirm();
    });

    window.onload = () => {
        connect();
        // 本地控制台不使用离线缓存, 避免旧 Service Worker 返回过期页面。
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(registrations => {
                registrations.forEach(reg => reg.unregister());
            }).catch(err => {
                console.warn('[SW] 清理失败:', err);
            });
        }
    };
